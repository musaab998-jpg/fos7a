<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="اطوِها!">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<title>اطوِها! Fold It!</title>
<meta name="theme-color" content="#151c2d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one dark desk under everything; a single centred column (home, battle) that turns into board + side panel on wide screens. Single dark world by choice. */
:root {
  --desk: #151c2d; --desk-2: #1f2839; --desk-3: #2a3449; --line: #34405a;
  --chalk: #e9ecf3; --muted: #9aa5bb; --soft: #cfd6e4;
  --marker: #f4d64a; --marker-deep: #b39a22; --marker-ink: #2a2206;
  --near: #e9962b; --pen-blue: #8fa8ff; --paper-hi: #f6f1e4; --paper-mid: #e2d8c3; --paper-lo: #cfc3aa;
  --f-display: "Lalezar", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--desk); color: var(--chalk); overflow: hidden; }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--marker); outline-offset: 3px; }

#app { position: relative; height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
#desk, #decor { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; }

/* home */
.home { padding: 16px; align-items: center; }
.home-col { width: 100%; max-width: 440px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
.icons { display: flex; gap: 8px; }
.icons .spacer { flex: 1; }
.ibtn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: rgba(42,52,73,.85); display: grid; place-items: center; cursor: pointer; flex: none; backdrop-filter: blur(4px); }
.ibtn svg { width: 20px; height: 20px; }
.ibtn.lang { font-family: var(--f-display); font-size: 17px; width: auto; padding: 0 12px; }
.home-mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; min-height: 0; }
.logo { width: clamp(112px, 22vh, 156px); aspect-ratio: 1; border-radius: 23%; transform: rotate(-4deg); box-shadow: 0 18px 30px -8px rgba(0,0,0,.75), 0 4px 8px rgba(0,0,0,.4); display: block; }
.wordmark { font-size: clamp(52px, 10vh, 76px); margin-top: 14px; background: linear-gradient(180deg, var(--paper-hi), var(--paper-mid) 55%, var(--paper-lo)); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 7px 7px rgba(0,0,0,.7)); padding: 0 8px; }
.tag { color: var(--pen-blue); font-size: 18px; font-weight: 500; line-height: 1.4; }
.underline { width: 180px; height: 14px; display: block; }
.btn { border: 0; border-radius: 18px; padding: 12px 16px; cursor: pointer; width: 100%; display: grid; gap: 0; justify-items: center; font-weight: 700; font-size: 17px; line-height: 1.5; }
.btn small { font-weight: 500; font-size: 12.5px; opacity: .75; }
.btn-marker { background: var(--marker); color: var(--marker-ink); box-shadow: 0 5px 0 var(--marker-deep); }
.btn-marker:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--marker-deep); }
.btn-marker[disabled] { background: var(--line); color: var(--chalk); box-shadow: 0 5px 0 var(--desk-3); opacity: .6; cursor: not-allowed; transform: none; }
.btn-ghost { background: rgba(31,40,57,.96); color: var(--chalk); border: 1.5px solid var(--line); }
.home-btns { display: grid; gap: 12px; padding-bottom: 8px; }
.btn-play { font-size: 20px; padding: 14px 16px; }
.modes { display: grid; gap: 8px; }
.mode { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; align-items: center; gap: 12px; text-align: start; background: var(--desk); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 12px; cursor: pointer; }
.mode svg { width: 34px; height: 34px; }
.mode b { display: block; font-size: 15.5px; }
.mode small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.45; }
.mode[aria-pressed="true"] { border-color: var(--marker); background: #26291f; }
.badge { font-size: 11.5px; font-weight: 700; color: var(--marker-ink); background: var(--marker); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.badge.done { background: var(--desk-3); color: var(--soft); }
.group-h { font-size: 13px; font-weight: 700; color: var(--soft); margin-bottom: -4px; }
.note { font-size: 12.5px; color: var(--muted); text-align: center; }

/* game */
.game { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; grid-template-areas: "head" "board" "side"; max-width: 560px; margin: 0 auto; }
.g-head { grid-area: head; }
.g-side { grid-area: side; }
.topbar { padding: 8px 10px 4px; display: flex; align-items: center; gap: 8px; }
.topbar .mid { flex: 1; min-width: 0; display: grid; gap: 2px; }
.topbar .ibtn { width: 40px; height: 40px; }
.turn { text-align: center; font-weight: 600; font-size: 15px; line-height: 1.3; display: flex; justify-content: center; align-items: center; gap: 8px; min-width: 0; }
.pip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.score { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; line-height: 1.3; color: var(--muted); }
.side { display: flex; align-items: center; gap: 6px; }
.lives { display: flex; gap: 3px; }
.lives i { width: 9px; height: 9px; border-radius: 50%; display: block; }
.timer { height: 3px; margin: 0 10px 4px; border-radius: 4px; background: var(--desk-3); overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--marker); transform-origin: right; }
[dir="ltr"] .timer i { transform-origin: left; }
.board-wrap { grid-area: board; min-height: 0; position: relative; margin: 0 4px; }
.board-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.status { text-align: center; font-size: 12.5px; color: var(--soft); padding: 4px 12px 0; min-height: 24px; line-height: 1.45; }
.status b { color: var(--marker); font-weight: 600; }
.controls { padding: 6px 10px 10px; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 8px; align-items: stretch; }
.controls .btn { padding: 8px 10px; font-size: 16px; }
.controls.solo { grid-template-columns: minmax(0, 1fr); }
.controls.solo .btn { padding: 12px 16px; font-size: 17px; }
.inks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.ink { font-size: 11.5px; background: var(--desk-3); border: 1.5px solid var(--line); border-radius: 12px; padding: 4px 2px; min-width: 0; cursor: pointer; display: grid; justify-items: center; gap: 1px; line-height: 1.3; }
.ink svg { width: 22px; height: 14px; }
.ink small { color: var(--muted); font-size: 10.5px; display: none; }
.ink span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.ink[aria-pressed="true"] { border-color: var(--marker); background: #3a3a2a; }
.ink[disabled] { opacity: .35; cursor: not-allowed; }
.toast { position: absolute; top: 96px; left: 50%; transform: translateX(-50%) translateY(-8px); padding: 6px 16px; border-radius: 999px; font-size: 14px; font-weight: 700; opacity: 0; transition: opacity .2s, transform .2s; z-index: 15; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (min-aspect-ratio: 5/4) {
  .game { max-width: 1000px; grid-template-columns: minmax(0, 1fr) 300px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "board head" "board side"; padding: 8px 8px 8px 0; }
  [dir="rtl"] .game { padding: 8px 0 8px 8px; }
  .board-wrap { margin: 0; }
  .g-side { align-self: start; }
  .controls { grid-template-columns: minmax(0, 1fr); }
  .controls .btn { padding: 12px 16px; font-size: 17px; }
  .ink { font-size: 12.5px; padding: 5px 4px; }
  .ink small { display: block; }
  .toast { top: 50%; }
}

/* sheets and overlays */
.overlay { position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 28px; text-align: center; background: rgba(15,20,31,.95); }
.overlay > * { max-width: 380px; width: 100%; }
.overlay h3 { font-size: 36px; }
.overlay p { color: var(--soft); font-size: 14.5px; }
.sheet { position: absolute; inset: 0; z-index: 30; background: rgba(10,14,22,.7); display: flex; align-items: flex-end; justify-content: center; }
.sheet-card { width: 100%; max-width: 520px; max-height: 88%; overflow: auto; background: var(--desk-2); border: 1px solid var(--line); border-bottom: 0; border-radius: 26px 26px 0 0; padding: 18px 16px 26px; display: grid; gap: 14px; }
.sheet-h { display: flex; align-items: center; justify-content: space-between; }
.sheet-h h3 { font-size: 28px; }
.lbl { font-size: 12.5px; color: var(--muted); margin-bottom: -6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button { background: var(--desk); border: 1px solid var(--line); border-radius: 12px; padding: 7px 0; font-size: 13.5px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--chalk); color: var(--desk); border-color: var(--chalk); font-weight: 700; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14.5px; }
.switch { width: 48px; height: 28px; border-radius: 99px; background: var(--desk); border: 1px solid var(--line); position: relative; cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); transition: inset-inline-start .15s; }
.switch[aria-checked="true"] { background: var(--marker); border-color: var(--marker); }
.switch[aria-checked="true"]::after { inset-inline-start: 23px; background: var(--marker-ink); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--desk); cursor: pointer; font-size: 18px; }
.stepper output { font-family: var(--f-display); font-size: 22px; min-width: 18px; text-align: center; }
.swatches { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.sw { border: 1.5px solid var(--line); border-radius: 12px; padding: 4px; cursor: pointer; background: var(--desk); display: grid; gap: 3px; justify-items: center; font-size: 11px; color: var(--soft); line-height: 1.3; }
.sw canvas { width: 100%; aspect-ratio: 1; border-radius: 8px; display: block; }
.sw[aria-pressed="true"] { border-color: var(--marker); }
@media (min-width: 560px) { .swatches { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { background: var(--desk-3); border-radius: 14px; padding: 8px 4px; display: grid; }
.stats b { font-family: var(--f-display); font-weight: 400; font-size: 26px; }
.stats span { font-size: 11.5px; color: var(--muted); }
.help-list { display: grid; gap: 8px; font-size: 14px; color: var(--soft); }
.help-list b { color: var(--chalk); }
.curtain { background: repeating-linear-gradient(90deg, #1e2638 0 18px, #222b3f 18px 36px); }
.hand-note { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

</head>
<body>
<div id="app" dir="rtl" lang="ar">
  <canvas id="desk" aria-hidden="true"></canvas>
  <canvas id="decor" aria-hidden="true"></canvas>

  <div class="view home" id="v-home">
    <div class="home-col">
      <div class="icons">
        <button type="button" class="ibtn" id="openSettings" data-aria="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4.9a7.6 7.6 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.4A7.6 7.6 0 0 0 7 6.4l-2.4-.9-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a7.6 7.6 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a7.6 7.6 0 0 0 2.6-1.5l2.4.9 2-3.4z"/></svg></button>
        <button type="button" class="ibtn" id="openKit" data-aria="kit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 4.5l4 4L9 19l-5 1 1-5z"/><path d="M13.5 6.5l4 4"/></svg></button>
        <button type="button" class="ibtn" id="openHelp" data-aria="help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.3 9.3a2.8 2.8 0 0 1 5.4 1c0 1.9-2.7 2.3-2.7 4.2"/><circle cx="12" cy="17.6" r="1.1" fill="currentColor" stroke="none"/></svg></button>
        <span class="spacer"></span>
        <a class="ibtn lang" href="../" style="text-decoration:none;color:inherit" aria-label="رجوع لفسحة">فسحة</a>
        <button type="button" class="ibtn lang" id="langBtn">EN</button>
      </div>
      <div class="home-mid">
        <canvas class="logo" id="homeLogo" width="320" height="320" aria-hidden="true"></canvas>
        <h1 class="wordmark" id="homeName">اطوِها!</h1>
        <p class="tag" id="homeTag">نقطة حبر وورقة تكفي</p>
        <svg class="underline" viewBox="0 0 210 14" aria-hidden="true"><path d="M4 10 C60 3, 150 5, 206 4" fill="none" stroke="#2c55e0" stroke-width="3.2" stroke-linecap="round"/><circle cx="206" cy="4" r="2.4" fill="#2c55e0"/></svg>
      </div>
      <div class="home-btns">
        <button type="button" class="btn btn-marker btn-play" id="playBtn"><span data-t="playNow"></span><small id="playHint"></small></button>
      </div>
    </div>
  </div>

  <div class="view game" id="v-game" hidden>
    <div class="g-head">
      <div class="topbar">
        <button type="button" class="ibtn" id="backBtn" data-aria="menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path class="chev" d="M9 6l6 6-6 6"/></svg></button>
        <div class="mid">
          <div class="turn" id="turnLbl"><span class="pip"></span><span>…</span></div>
          <div class="score">
            <div class="side"><span id="meName"></span><div class="lives" id="meLives"></div></div>
            <div class="side"><div class="lives" id="opLives"></div><span id="opName"></span></div>
          </div>
        </div>
        <button type="button" class="ibtn sound-btn" data-aria="sound"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
      </div>
      <div class="timer" id="timerBar"><i id="timerFill"></i></div>
    </div>
    <div class="board-wrap" id="boardWrap"><canvas id="board"></canvas></div>
    <div class="g-side">
      <div class="status" id="status"></div>
      <div class="controls">
        <div class="inks">
          <button type="button" class="ink" data-ink="normal" aria-pressed="true"><svg viewBox="0 0 22 14"><circle cx="11" cy="7" r="3.8" fill="currentColor"/></svg><span data-t="inkNormal"></span><small data-t="unlimited"></small></button>
          <button type="button" class="ink" data-ink="big" aria-pressed="false"><svg viewBox="0 0 22 14"><circle cx="11" cy="7" r="6.5" fill="currentColor"/></svg><span data-t="inkBig"></span><small id="bigLeft"></small></button>
          <button type="button" class="ink" data-ink="double" aria-pressed="false"><svg viewBox="0 0 22 14"><circle cx="6" cy="7" r="3.6" fill="currentColor"/><circle cx="16" cy="7" r="3.6" fill="currentColor"/></svg><span data-t="inkDouble"></span><small id="dblLeft"></small></button>
        </div>
        <button type="button" class="btn btn-marker" id="foldBtn" disabled></button>
      </div>
    </div>
    <div class="toast" id="toast"></div>
  </div>

  <div class="sheet" id="modes" hidden>
    <div class="sheet-card">
      <div class="sheet-h"><h3 data-t="howPlay"></h3><button type="button" class="ibtn" data-close data-aria="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="modes">
        <button type="button" class="mode" data-m="daily"><svg viewBox="0 0 34 34" fill="none"><rect x="4" y="6" width="26" height="24" rx="4" fill="#fbfbf5"/><path d="M4 12h26" stroke="#e46b6b" stroke-width="2"/><path d="M11 3v6M23 3v6" stroke="#9aa5bb" stroke-width="2.4" stroke-linecap="round"/><circle cx="17" cy="21" r="4.5" fill="#1d3fb8"/></svg><span><b data-t="daily"></b><small id="dailyInfo"></small></span><span class="badge" id="dailyBadge"></span></button>
        <button type="button" class="mode" data-m="ai"><svg viewBox="0 0 34 34" fill="none"><rect x="6" y="9" width="22" height="18" rx="5" fill="#2a3449" stroke="#9aa5bb" stroke-width="1.8"/><circle cx="13" cy="18" r="2.6" fill="#f4d64a"/><circle cx="21" cy="18" r="2.6" fill="#f4d64a"/><path d="M17 4v5" stroke="#9aa5bb" stroke-width="1.8" stroke-linecap="round"/></svg><span><b data-t="vsAi"></b><small data-t="vsAiHint"></small></span><span></span></button>
        <button type="button" class="mode" data-m="pass"><svg viewBox="0 0 34 34" fill="none"><circle cx="11" cy="12" r="4.5" fill="#6d8dff"/><circle cx="23" cy="12" r="4.5" fill="#ef6b6b"/><path d="M3.5 28c.8-5 3.6-8 7.5-8s6.7 3 7.5 8M15.5 28c.8-5 3.6-8 7.5-8s6.7 3 7.5 8" stroke="#cfd6e4" stroke-width="2" stroke-linecap="round"/></svg><span><b data-t="pass"></b><small data-t="passHint"></small></span><span></span></button>
      </div>
      <p class="note" id="dailyNote"></p>
      <div class="lbl" data-t="difficulty" id="diffLbl"></div>
      <div class="seg" id="diffSeg"><button type="button" data-d="easy"></button><button type="button" data-d="normal"></button><button type="button" data-d="hard"></button></div>
      <div class="row" id="soldiersRow"><span data-t="soldiers"></span><div class="stepper"><button type="button" id="nMinus">−</button><output id="nOut"></output><button type="button" id="nPlus">+</button></div></div>
      <button type="button" class="btn btn-marker" id="goBtn" data-t="go"></button>
    </div>
  </div>

  <div class="sheet" id="settings" hidden>
    <div class="sheet-card">
      <div class="sheet-h"><h3 data-t="settings"></h3><button type="button" class="ibtn" data-close data-aria="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="lbl" data-t="language"></div>
      <div class="seg two" id="langSeg"><button type="button" data-l="ar">العربية</button><button type="button" data-l="en">English</button></div>
      <div class="row"><span data-t="sound"></span><button type="button" class="switch" id="swSound" role="switch" aria-checked="true"></button></div>
      <div class="group-h" data-t="extras"></div>
      <div class="row"><span data-t="timer"></span><button type="button" class="switch" id="swTimer" role="switch" aria-checked="true"></button></div>
      <div class="row"><span data-t="moving"></span><button type="button" class="switch" id="swShift" role="switch" aria-checked="true"></button></div>
      <div class="row"><span data-t="hazards"></span><button type="button" class="switch" id="swHaz" role="switch" aria-checked="true"></button></div>
      <button type="button" class="btn btn-marker" data-close data-t="done"></button>
    </div>
  </div>

  <div class="sheet" id="kit" hidden>
    <div class="sheet-card">
      <div class="sheet-h"><h3 data-t="kit"></h3><button type="button" class="ibtn" data-close data-aria="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="lbl" data-t="paper"></div>
      <div class="swatches" id="paperSw"></div>
      <div class="lbl" data-t="ink"></div>
      <div class="swatches" id="inkSw"></div>
      <button type="button" class="btn btn-marker" data-close data-t="done"></button>
    </div>
  </div>

  <div class="sheet" id="help" hidden>
    <div class="sheet-card">

  function newGame() {

      special: { 1: { big: 1, double: 1 }, 2: { big: 1, double: 1 } }, stats: { 1: { f: 0, h: 0 }, 2: { f: 0, h: 0 } }, fold: { cy: MID, ang: 0 }, deadline: 0 });
    game++;
    const wr = wrap.getBoundingClientRect();
    if (wr.width > 40 && wr.height > 40) { H = Math.min(1.75, Math.max(1.3, (wr.height - 4) / (wr.width - 4))); MID = H / 2; S.fold = { cy: MID, ang: 0 }; }
    $("result").hidden = true; $("curtain").hidden = true;
    if (S.mode === "daily") { setupDaily(); resize(); return; }
    setStatus(() => t("setupStatus", num(S.N)));
    if (S.mode === "pass") curtain("p1Starts", "p1StartsText", () => {});
    refresh(); resize();
  }
  let game = 0; // bumps on every new game so stale timers from an abandoned one do nothing
  const later = (fn, ms) => { const g = game; setTimeout(() => { if (g === game) fn(); }, ms); };
  const baseFold = () => ({ c: { x: 0.5, y: MID }, n: { x: 0, y: 1 }, t: { x: 1, y: 0 } });
  function randomLayout(p) {
    const out = [], f = baseFold(); let g = 0;
    while (out.length < S.N && g++ < 800) { const c = { x: rnd(EDGE, 1 - EDGE), y: p === 1 ? rnd(MID + SAFE, H - EDGE) : rnd(EDGE, MID - SAFE) }; if (out.every((o) => dist(o, c) > 0.17) && onSide(f, c, p, SAFE)) out.push(c); }
    return out.map((c) => ({ p, x: c.x, y: c.y, alive: true, tape: false }));
  }
  function finishSetup(p) {
    if (S.mode === "ai") { S.soldiers.push(...randomLayout(2)); startBattle(); }
    else if (p === 1) { S.turn = 2; S.viewer = 2; curtain("p2Turn", "p2TurnText", () => { setStatus(() => t("setupStatus", num(S.N))); refresh(); render(); }); refresh(); }

  }
  function startBattle() {

  let curtainKeys = null;
  function curtain(title, body, then) {

    $("curtainBtn").onclick = () => { $("curtain").hidden = true; play("tap"); then && then(); render(); };
  }

  function moveFold() {
    if (S.mode === "daily") { const f = D.spec.folds[Math.min(4, S.stats[1].f)]; S.fold = { cy: MID + f.off * MID, ang: f.ang }; return; }
    if (!S.shiftOn) { S.fold = { cy: MID, ang: 0 }; return; }
    // a random shift and tilt that never crosses a live soldier; smaller moves when they sit near the middle
    const live = S.soldiers.filter((s) => s.alive);
    for (let scale = 1, i = 0; i < 4; i++, scale *= 0.6) {
      for (let j = 0; j < 12; j++) {
        const cand = { cy: MID + rnd(-0.07, 0.07) * scale, ang: (rnd(-10, 10) * scale * Math.PI) / 180 };

  }
  function beginTurn(keepFold) {

    S.drops = []; S.ink = "normal"; S.busy = false;
    if (S.mode === "daily") { setStatus(() => t("dailyStatus")); S.deadline = 0; refresh(); render(); return; }
    if (S.mode === "ai" && S.turn === 2) { setStatus(() => t("aiThinking")); S.deadline = 0; refresh(); render(); later(aiTurn, 700); return; }
    setStatus(() => (S.shiftOn ? t("aimMoving") : t("aim")));
    S.deadline = S.timerOn ? performance.now() + 10000 : 0; $("timerFill").style.transform = "scaleX(1)"; $("timerFill").style.background = "var(--marker)";
    refresh(); render();
  }

  function doFold() {
    const need = S.ink === "double" ? 2 : 1;
    if (S.phase !== "battle" || S.drops.length < need || S.busy) return;
    const shooter = S.turn, size = S.ink === "big" ? "big" : "normal", g = game;
    if (S.ink !== "normal") S.special[shooter][S.ink] = 0;
    S.busy = true; S.phase = "folding"; S.stats[shooter].f++; S.deadline = 0;
    play("fold"); buzz(25); refresh();
    const drops = S.drops.slice(), t0 = performance.now(), CLOSE = 560, HOLD = 220, OPEN = 520;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let results = null;
    S.anim = { shooter, p: 0 };
    const step = (now) => {
      if (g !== game) return;

      S.anim.p = reduce ? (k < 200 ? 1 : 0) : k < CLOSE ? ease(k / CLOSE) : k < CLOSE + HOLD ? 1 : 1 - ease(Math.min(1, (k - CLOSE - HOLD) / OPEN));
      if (!results && (reduce ? k >= 100 : k >= CLOSE)) { results = drops.map((d) => resolve(shooter, d, size)); S.drops = []; play("stamp"); buzz(90); }
      render();

    requestAnimationFrame(step);
  }

  function resolve(shooter, d, size) {
    const f = foldOf(S), tp = reflect(f, d), target = shooter === 1 ? 2 : 1, inkR = INK[size];
    const st = { p: shooter, x: tp.x, y: tp.y, sx: d.x, sy: d.y, size, seed: Math.floor(Math.random() * 1e9), res: "miss" };
    if (!inSheet(tp)) { st.res = "off"; S.stamps.push(st); return st; }
    if (S.coffee.some((c) => c.p === target && dist(c, tp) < c.r)) { st.res = "coffee"; S.stamps.push(st); return st; }
    let best = null, bd = 9;
    for (const s of S.soldiers) if (s.p === target && s.alive) { const dd = dist(s, tp); if (dd < bd) { bd = dd; best = s; } }
    if (best && bd <= SR + inkR * 0.85) {

      else { best.alive = false; st.res = "hit"; S.stats[shooter].h++; }
      st.near = true;

  }

  function splash(st) {
    const parts = [];
    for (let i = 0; i < 26; i++) { const a = Math.random() * 7, v = rnd(0.004, 0.014); parts.push({ x: st.x, y: st.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: rnd(2, 5), c: penC(st.p), life: 1 }); }

      render(); if (k < 1) requestAnimationFrame(step); else { S.fx = null; render(); }
    };
    requestAnimationFrame(step);
  }

  function afterFold(shooter, results) {
    const hits = results.filter((r) => r.res === "hit"), target = shooter === 1 ? 2 : 1;
    if (hits.length) { splash(hits[0]); play("hit"); buzz([60, 40, 120]); toast(hits.length > 1 ? t("twoHits") : S.mode === "daily" ? t("hit") : t("hitKeeps"), pen(shooter)); }
    else if (results.some((r) => r.res === "tape")) { play("tape"); toast(t("tapeSaved"), "#b8a76a", "#2a2206"); }
    else if (results.some((r) => r.res === "coffee")) { play("slurp"); toast(t("coffee"), "#7a4d22"); }
    else if (results.every((r) => r.res === "off")) { play("miss"); toast(t("off"), "#e9ecf3", "#161d2c"); }
    else if (results.some((r) => r.near)) { play("miss"); toast(t("near"), "#e9962b"); }
    else { play("miss"); toast(t("miss"), "#e9ecf3", "#161d2c"); }
    if (S.mode === "daily") {
      const r0 = results[0]; D.marks.push(r0.res === "hit" ? "hit" : r0.res === "tape" ? "tape" : r0.near ? "near" : "miss");
      if (S.stats[1].f >= 5 || !S.soldiers.some((s) => s.alive)) return dailyOver();
      S.phase = "battle"; later(() => beginTurn(), 650); return;
    }
    if (!S.soldiers.some((s) => s.p === target && s.alive)) return gameOver(shooter);
    S.phase = "battle";
    if (hits.length) { later(() => beginTurn(), 650); return; } // a hit keeps the turn
    S.turn = target;
    if (S.mode === "pass") { S.busy = true; refresh(); later(() => { S.viewer = target; toast(t("turnOf", names(target)), pen(target)); beginTurn(); }, 800); }
    else later(() => beginTurn(), 450);
  }

  let lastWinner = 0;
  function showResult() {

    $("shareBtn").hidden = !daily; $("againBtn").hidden = daily; $("resNote").hidden = !daily;
    $("stALbl").textContent = daily ? t("streak") : t("accuracy");
    if (daily) {

      $("resTitle").textContent = t("dailyTitle", num(D.no)); $("resTitle").style.color = "var(--marker)";
      $("resText").textContent = t("dailyScore", num(h)) + (D.practice ? ` · ${t("practice")}` : "");
      $("stF").textContent = num(S.stats[1].f); $("stH").textContent = num(h); $("stA").textContent = num(streak());
      $("resNote").textContent = t("dailyNext", num(hoursLeft()));
      return;
    }

    $("resTitle").textContent = S.mode === "ai" ? (w === 1 ? t("youWin") : t("aiWins")) : t("wins", names(w)); $("resTitle").style.color = lighten(pen(w), 0.35);
    $("resText").textContent = S.mode === "ai" && w === 2 ? t("loseText") : t("winText");
    $("stF").textContent = num(st.f); $("stH").textContent = num(st.h); $("stA").textContent = lang === "ar" ? AR(st.f ? Math.round((st.h / st.f) * 100) : 0) + "٪" : (st.f ? Math.round((st.h / st.f) * 100) : 0) + "%";
  }
  function gameOver(w) {

  // ---------------- daily puzzle ----------------
  // Everyone gets the same sheet each day: five enemy soldiers, one coffee stain, one taped soldier and
  // five fold lines, all drawn from the date. Positions are kept as fractions of the enemy half so the
  // puzzle is the same on every screen shape.
  const DKEY = "foldit.daily.v1";
  const today = () => { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); };
  const FIRST_DAY = Math.floor(Date.UTC(2026, 8, 1) / 864e5);
  const puzzleNo = () => today() - FIRST_DAY + 1;
  const hoursLeft = () => { const d = new Date(), m = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1); return Math.max(1, Math.ceil((m - d) / 36e5)); };
  function dailyLog() { try { return JSON.parse(localStorage.getItem(DKEY) || "{}") || {}; } catch (e) { return {}; } }
  function saveDaily(day, rec) { const log = dailyLog(); log[day] = rec; try { localStorage.setItem(DKEY, JSON.stringify(log)); } catch (e) {} }
  function streak() { const log = dailyLog(); let d = today(); if (!log[d]) d--; let n = 0; while (log[d]) { n++; d--; } return n; }
  let D = null;
  function buildDaily(day) {
    const R = seeded(day * 7919 + 17), r = (a, b) => a + R() * (b - a), NM = 0.725; // NM: the middle on a standard sheet
    const soldiers = []; let g = 0;
    while (soldiers.length < 5 && g++ < 3000) {
      const c = { x: r(0.07, 0.93), v: r(0.2, 0.9) };
      if (soldiers.every((o) => Math.hypot(o.x - c.x, (o.v - c.v) * NM) > 0.18)) soldiers.push(c);
    }
    soldiers[Math.floor(R() * soldiers.length)].tape = true;
    let coffee = null; g = 0;
    do { coffee = { x: r(0.15, 0.85), v: r(0.25, 0.85), r: r(0.06, 0.08), seed: Math.floor(R() * 1e9) }; } while (g++ < 300 && soldiers.some((o) => Math.hypot(o.x - coffee.x, (o.v - coffee.v) * NM) < coffee.r + SR * 1.4));
    const folds = [];
    for (let i = 0; i < 5; i++) {
      let pickF = { off: 0, ang: 0 };
      for (let scale = 1, k = 0; k < 4 && !pickF.off; k++, scale *= 0.6) {
        for (let j = 0; j < 12; j++) {
          const off = r(-0.1, 0.1) * scale, ang = (r(-10, 10) * scale * Math.PI) / 180;
          const f = foldOf({ fold: { cy: NM + off * NM, ang } });
          if (soldiers.every((o) => onSide(f, { x: o.x, y: NM - o.v * NM }, 2, SR * 1.4))) { pickF = { off, ang }; break; }
        }
      }
      folds.push(pickF);
    }
    return { soldiers, coffee, folds };
  }
  function setupDaily() {
    const day = today();
    const spec = buildDaily(day);
    D = { no: puzzleNo(), day, spec, practice: !!dailyLog()[day], marks: [] };
    S.soldiers = spec.soldiers.map((c) => ({ p: 2, x: c.x, y: MID - c.v * MID, alive: true, tape: !!c.tape }));
    S.coffee = [{ p: 2, x: spec.coffee.x, y: MID - spec.coffee.v * MID, r: spec.coffee.r, seed: spec.coffee.seed }];
    S.special = { 1: { big: 0, double: 0 }, 2: { big: 0, double: 0 } };
    S.phase = "battle"; S.turn = 1; S.viewer = 1;
    beginTurn();
  }
  function dailyOver() {
    S.phase = "over"; S.deadline = 0; refresh(); render();
    const h = S.stats[1].h;
    if (!D.practice) saveDaily(D.day, { h, m: D.marks.join(",") });
    play(h >= 3 ? "win" : "lose"); buzz([80, 60, 160]);
    later(() => { showResult(); $("result").hidden = false; }, 900);
  }
  $("shareBtn").onclick = () => {
    const icons = { hit: "🟦", tape: "🟨", near: "🟧", miss: "⬜" };
    const txt = `${t("appName")} ${t("dailyTitle", D.no)}\n${D.marks.map((m) => icons[m]).join("")} ${S.stats[1].h}/5`;
    const shown = () => { const n = $("resNote"); n.textContent = txt; n.style.userSelect = "text"; try { const rg = document.createRange(); rg.selectNodeContents(n); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); } catch (e) {} };
    try { navigator.clipboard.writeText(txt).then(() => toast(t("copied"), "#3fbf7f"), shown); } catch (e) { shown(); }
  };

  // ---------------- computer ----------------
  function aiTurn() {
    if (S.phase !== "battle" || S.turn !== 2) return;
    const f = foldOf(S), targets = S.soldiers.filter((s) => s.p === 1 && s.alive);
    if (!targets.length) return;
    const sigma = { easy: 0.124, normal: 0.089, hard: 0.066 }[S.diff];
    const aim = (tg) => { const src = reflect(f, tg); let p = { x: src.x + gauss() * sigma, y: src.y + gauss() * sigma }; p.x = Math.min(0.97, Math.max(0.03, p.x)); p.y = Math.min(H - 0.03, Math.max(0.03, p.y)); if (!onSide(f, p, 2, 0.01)) p = reflect(f, p); return p; };
    const pick = targets.slice().sort((a, b) => (a.tape - b.tape) + Math.random() - 0.5)[0];
    let ink = "normal"; const sp = S.special[2];
    if (S.diff !== "easy" && sp.double && targets.length > 1 && Math.random() < 0.35) ink = "double";
    else if (S.diff !== "easy" && sp.big && Math.random() < 0.3) ink = "big";
    S.ink = ink; S.drops = [];
    const list = [aim(pick)]; if (ink === "double") list.push(aim(targets.find((x) => x !== pick) || pick));
    setStatus(() => t("aiAiming")); refresh();
    let i = 0; const next = () => { S.drops.push(list[i++]); play("drop"); render(); if (i < list.length) later(next, 350); else later(doFold, 480); };
    later(next, 400);
  }

  // ---------------- input ----------------
  let dragI = -1;
  function toBoard(ev) {
    const r = board.getBoundingClientRect(); let x = (ev.clientX - r.left - L.ox) / L.u, y = (ev.clientY - r.top - L.oy) / L.u;
    if (S.viewer === 2) { x = 1 - x; y = H - y; } return { x, y };
  }
  board.addEventListener("pointerdown", (ev) => {
    if (S.busy || S.phase === "over" || S.phase === "folding" || !$("curtain").hidden) return;
    ac(); const p = toBoard(ev);
    if (S.phase === "setup") return setupTap(p);
    if (S.mode === "ai" && S.turn === 2) return;
    const f = foldOf(S);
    if (!onSide(f, p, S.turn, 0.015) || !inSheet(p, 0.02)) { toast(t("wrongSide"), "#e9962b"); buzz(20); return; }
    const need = S.ink === "double" ? 2 : 1;
    if (S.drops.length < need) { S.drops.push(p); dragI = S.drops.length - 1; play("drop"); buzz(12); }
    else { let bi = 0, bd = 9; S.drops.forEach((d, i) => { const dd = dist(d, p); if (dd < bd) { bd = dd; bi = i; } }); S.drops[bi] = p; dragI = bi; }
    try { board.setPointerCapture(ev.pointerId); } catch (e) {}
    refresh(); render();
  });
  board.addEventListener("pointermove", (ev) => {
    if (dragI < 0 || S.phase !== "battle") return;
    const p = toBoard(ev), f = foldOf(S);
    if (onSide(f, p, S.turn, 0.015) && inSheet(p, 0.02)) { S.drops[dragI] = p; render(); }
  });
  const end = () => { dragI = -1; }; board.addEventListener("pointerup", end); board.addEventListener("pointercancel", end);

  function setupTap(p) {
    const me = S.turn, mine = S.soldiers.filter((s) => s.p === me);
    const hi = S.soldiers.findIndex((s) => s.p === me && dist(s, p) < SR * 1.3);
    if (hi >= 0) { S.soldiers.splice(hi, 1); play("miss"); const n = mine.length - 1; setStatus(() => t("remaining", num(S.N - n))); refresh(); render(); return; }
    if (mine.length >= S.N) { toast(t("full"), "#e9ecf3", "#161d2c"); return; }
    if (!onSide(baseFold(), p, me, SAFE) || p.x < EDGE || p.x > 1 - EDGE || (me === 1 ? p.y > H - EDGE : p.y < EDGE)) { toast(t("badSpot"), "#e9962b"); buzz(20); return; }
    if (mine.some((s) => dist(s, p) < 0.15)) { toast(t("tooClose"), "#e9962b"); buzz(20); return; }
    S.soldiers.push({ p: me, x: p.x, y: p.y, alive: true, tape: false }); play("place"); buzz(12);
    const n = mine.length + 1; setStatus(() => (n < S.N ? t("remaining", num(S.N - n)) : t("allPlaced")));
    refresh(); render();
  }

  $("foldBtn").onclick = () => { ac(); if (S.phase === "setup") { if (S.soldiers.filter((s) => s.p === S.turn).length >= S.N) { play("tap"); finishSetup(S.turn); } return; } doFold(); };
  document.querySelectorAll(".ink").forEach((b) => (b.onclick = () => { S.ink = b.dataset.ink; const need = S.ink === "double" ? 2 : 1; if (S.drops.length > need) S.drops.length = need; play("tap"); refresh(); render(); }));
  addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && inGame() && document.activeElement === document.body) { e.preventDefault(); $("foldBtn").click(); } });

  // timer + pulse loop
  let lastTick = 0, lastSec = -1;
  function loop(now) {
    if (inGame()) {
      if (S.drops.length && !S.anim && now - lastTick > 50) { S.pulse = (Math.sin(now / 260) + 1) / 2; render(); lastTick = now; }
      if (S.deadline && S.phase === "battle" && !S.busy && $("curtain").hidden) {
        const left = S.deadline - now; $("timerFill").style.transform = `scaleX(${Math.max(0, left / 10000)})`;
        $("timerFill").style.background = left < 3000 ? "#e9962b" : "var(--marker)";
        const sec = Math.ceil(left / 1000); if (sec !== lastSec && sec <= 3 && sec > 0) play("tick"); lastSec = sec;
        if (left <= 0) {
          S.deadline = 0; const f = foldOf(S);
          const need = S.ink === "double" ? 2 : 1;
          while (S.drops.length < need) { let p, g = 0; do { p = { x: rnd(0.1, 0.9), y: S.turn === 1 ? rnd(MID, H - 0.05) : rnd(0.05, MID) }; } while (g++ < 50 && !onSide(f, p, S.turn, 0.03)); S.drops.push(p); }
          toast(t("timeUp"), "#e9962b"); doFold();
        }
      }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ---------------- screens, sheets, settings ----------------
  function paintBackdrop() { drawDesk($("desk")); if (!$("v-home").hidden) drawDecor($("decor")); }
  function show(view) {
    $("v-home").hidden = view !== "home"; $("v-game").hidden = view !== "game"; $("decor").hidden = view !== "home";
    if (view === "home") drawDecor($("decor"));
  }
  const startMode = (m) => { ac(); play("tap"); S.mode = m; show("game"); newGame(); };
  let pick = "ai";
  function syncModes() {
    const rec = dailyLog()[today()], st = streak();
    $("dailyInfo").textContent = rec ? t("dailyDone", num(rec.h), num(st)) : t("dailyReady", num(puzzleNo()));
    $("dailyBadge").textContent = rec ? t("badgeDone") : t("badgeNew"); $("dailyBadge").classList.toggle("done", !!rec);
    document.querySelectorAll(".mode").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === pick)));
    $("diffLbl").hidden = $("diffSeg").hidden = pick !== "ai";
    $("soldiersRow").hidden = pick === "daily";
    $("dailyNote").hidden = pick !== "daily"; $("dailyNote").textContent = rec ? t("dailyPractice") : t("dailyRules");
    $("playHint").textContent = rec ? (st > 1 ? t("playHintStreak", num(st)) : t("dailyDone", num(rec.h), num(st))) : t("playHintNew");
  }
  const closeSheets = () => document.querySelectorAll(".sheet").forEach((x) => (x.hidden = true));
  $("playBtn").onclick = () => { ac(); play("tap"); if (!dailyLog()[today()]) pick = "daily"; syncModes(); $("modes").hidden = false; };
  document.querySelectorAll(".mode").forEach((b) => (b.onclick = () => { pick = b.dataset.m; play("tap"); syncModes(); }));
  $("goBtn").onclick = () => { closeSheets(); startMode(pick); };
  $("openKit").onclick = () => { play("tap"); $("kit").hidden = false; drawSwatches(); };
  const toHome = () => { game++; syncModes(); show("home"); $("result").hidden = true; $("curtain").hidden = true; S.phase = "over"; S.deadline = 0; S.busy = false; S.anim = null; S.fx = null; play("tap"); };
  $("backBtn").onclick = toHome; $("homeBtn").onclick = toHome; $("againBtn").onclick = () => { play("tap"); newGame(); };
  $("openSettings").onclick = () => { play("tap"); $("settings").hidden = false; };
  $("openHelp").onclick = () => { play("tap"); $("help").hidden = false; };
  document.querySelectorAll("[data-close]").forEach((b) => (b.onclick = () => { play("tap"); closeSheets(); }));
  document.querySelectorAll(".sheet").forEach((s) => s.addEventListener("click", (e) => { if (e.target === s) s.hidden = true; }));
  addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheets(); });
  document.querySelectorAll("#diffSeg button").forEach((b) => (b.onclick = () => { S.diff = b.dataset.d; play("tap"); syncControls(); saveSettings(); }));
  $("nMinus").onclick = () => { S.N = Math.max(3, S.N - 1); play("tap"); syncControls(); saveSettings(); };
  $("nPlus").onclick = () => { S.N = Math.min(5, S.N + 1); play("tap"); syncControls(); saveSettings(); };
  const sw = (id, key) => { $(id).onclick = () => { S[key] = !S[key]; play("tap"); syncControls(); saveSettings(); }; };
  sw("swTimer", "timerOn"); sw("swShift", "shiftOn"); sw("swHaz", "hazOn"); sw("swSound", "sound");
  document.querySelectorAll(".sound-btn").forEach((b) => (b.onclick = () => { S.sound = !S.sound; syncControls(); saveSettings(); play("tap"); }));
  const setLang = (l) => { lang = l; applyLang(); saveSettings(); play("tap"); };
  document.querySelectorAll("#langSeg button").forEach((b) => (b.onclick = () => setLang(b.dataset.l)));
  $("langBtn").onclick = () => setLang(lang === "ar" ? "en" : "ar");

  function syncControls() {
    document.querySelectorAll(".sound-btn .wave").forEach((w) => (w.style.opacity = S.sound ? 1 : 0.15));
    document.querySelectorAll(".sound-btn").forEach((b) => b.setAttribute("aria-pressed", String(S.sound)));
    $("swSound").setAttribute("aria-checked", String(S.sound)); $("swTimer").setAttribute("aria-checked", String(S.timerOn));
    $("swShift").setAttribute("aria-checked", String(S.shiftOn)); $("swHaz").setAttribute("aria-checked", String(S.hazOn));
    document.querySelectorAll("#diffSeg button").forEach((x) => { x.setAttribute("aria-pressed", String(x.dataset.d === S.diff)); x.textContent = t(x.dataset.d); });
    document.querySelectorAll("#langSeg button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.l === lang)));
    $("nOut").textContent = num(S.N);
    syncModes();
  }
  function applyLang() {
    const app = $("app"); app.dir = lang === "ar" ? "rtl" : "ltr"; app.lang = lang; document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach((el) => (el.textContent = t(el.dataset.t)));
    document.querySelectorAll("[data-aria]").forEach((el) => el.setAttribute("aria-label", TEXT[lang].aria[el.dataset.aria]));
    $("homeName").textContent = t("appName"); $("homeTag").textContent = t("tagline");
    $("langBtn").textContent = lang === "ar" ? "EN" : "ع"; $("langBtn").setAttribute("aria-label", lang === "ar" ? "English" : "العربية");
    document.querySelector("#backBtn .chev").setAttribute("d", lang === "ar" ? "M9 6l6 6-6 6" : "M15 6l-6 6 6 6");
    $("helpList").innerHTML = t("helpSteps").map(([b, s]) => `<div><b>${b}</b> ${s}</div>`).join("");
    document.querySelectorAll(".sw").forEach((b) => { const item = (b.dataset.kind === "paper" ? PAPERS : INKS).find((x) => x.id === b.dataset.id); b.querySelector("span").textContent = lang === "ar" ? item.name : item.en; });
    if (curtainKeys && !$("curtain").hidden) { $("curtainTitle").textContent = t(curtainKeys[0]); $("curtainText").textContent = t(curtainKeys[1]); }
    if (!$("result").hidden) showResult();
    $("status").innerHTML = statusFn();
    syncControls(); if (inGame()) { refresh(); render(); }
  }

  // swatches: tiny preview of paper + ink
  function swatch(canvas, pp, ii) {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2), w = Math.max(40, r.width);
    canvas.width = w * dpr; canvas.height = w * dpr; const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
    const savedP = paper, savedI = inkSet; paper = pp; inkSet = ii;
    ctx.save(); ctx.scale(1 / 4, 1 / (4 * H)); drawPaper(ctx, w * 4, null); ctx.restore();
    blob(ctx, w * 0.35, w * 0.62, w * 0.14, 5, penC(1), 0.95); blob(ctx, w * 0.66, w * 0.32, w * 0.12, 9, penC(2), 0.9);
    paper = savedP; inkSet = savedI;
  }
  function buildSwatches(el, list, kind) {
    el.innerHTML = "";
    list.forEach((item) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "sw"; b.dataset.id = item.id; b.dataset.kind = kind;
      b.innerHTML = "<canvas></canvas><span></span>";
      b.onclick = () => { if (kind === "paper") paper = item; else inkSet = item; play("tap"); saveSettings(); drawSwatches(); if (inGame()) { refresh(); render(); } };
      el.append(b);
    });
  }
  function drawSwatches() {
    document.querySelectorAll("#paperSw .sw").forEach((b) => swatch(b.querySelector("canvas"), PAPERS.find((p) => p.id === b.dataset.id), inkSet));
    document.querySelectorAll("#inkSw .sw").forEach((b) => swatch(b.querySelector("canvas"), paper, INKS.find((p) => p.id === b.dataset.id)));
    document.querySelectorAll("#paperSw .sw").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === paper.id)));
    document.querySelectorAll("#inkSw .sw").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.id === inkSet.id)));
  }
  buildSwatches($("paperSw"), PAPERS, "paper"); buildSwatches($("inkSw"), INKS, "ink");

  let rsT = 0;
  addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(() => { paintBackdrop(); if (!$("kit").hidden) drawSwatches(); }, 80); });
  new ResizeObserver(() => { if (inGame()) resize(); }).observe(wrap);

  loadSettings();
  applyLang();
  const boot = () => { drawHomeLogo($("homeLogo")); paintBackdrop(); if (!$("kit").hidden) drawSwatches(); };
  boot();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot);

})();
</script>

</body>
</html>
