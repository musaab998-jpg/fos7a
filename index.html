<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script>
  // One address for everyone. www.fos7a.games and fos7a.pages.dev each keep their own storage, so a host who
  // signed in on one of them looked signed out on the other. Only those two exact names move; a Google sign-in
  // coming back (?code= / ?error=) finishes where it started, and localhost, branch previews and the app stay put.
  (function () {
    var h = location.hostname;
    if ((h === "www.fos7a.games" || h === "fos7a.pages.dev") && !/[?&](code|error)=/.test(location.search) && !/Fos7aApp/.test(navigator.userAgent))
      location.replace("https://fos7a.games" + location.pathname + location.search + location.hash);
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffc933">
<meta name="description" content="ألعاب جماعية للجمعات: افتحوا غرفة وكل واحد يلعب من جواله.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<title>فسحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Layout: فسحة is the school yard (bus yellow, navy ink); each game opens its own room: خلّصت! on a ruled notebook, خط ثلاثة on a chalkboard. Two typefaces everywhere. */
:root {
  --yard: #ffc933; --yard-deep: #e0a800; --cream: #fff6dc; --navy: #1b2a4a; --navy-2: #2c3e66; --red: #e5484d; --white: #fffdf6;
  --f-display: "Lalezar", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.6; background: var(--cream); color: var(--navy); -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
.av { display: block; filter: drop-shadow(0 3px 3px rgba(0,0,0,.3)); flex: none; }

/* ================= the yard (hub) ================= */
.hub { padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right)); padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
.hub-in { max-width: 1060px; margin: 0 auto; }
.hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 34px; line-height: 1; color: var(--navy); text-decoration: none; }
.logo svg { width: 34px; height: 34px; }
.joinbox { display: flex; gap: 8px; margin-top: 16px; max-width: 360px; }
.joinbox input { flex: 1; min-width: 0; border: 3px solid var(--navy); border-radius: 14px; padding: 8px 12px; font-family: var(--f-display); font-size: 22px; letter-spacing: .2em; text-align: center; background: var(--white); color: var(--navy); direction: ltr; text-transform: uppercase; }
.qr svg { width: 100%; height: auto; display: block; }
.hbtn { border: 3px solid var(--navy); border-radius: 16px; padding: 10px 20px; font-weight: 700; font-size: 17px; background: var(--navy); color: var(--yard); box-shadow: 0 4px 0 #0d162b; text-decoration: none; display: inline-block; }
.hbtn.alt { background: var(--white); color: var(--navy); box-shadow: 0 4px 0 var(--navy); }
.hbtn:active { transform: translateY(3px); box-shadow: none; }
.note { font-size: 13px; color: #5d6887; margin-top: 10px; }
.modal { position: fixed; inset: 0; background: rgba(27,42,74,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0 12px; }
.modal-card { width: 100%; max-width: 520px; max-height: 88vh; max-height: 88dvh; overflow: auto; padding-bottom: calc(26px + env(safe-area-inset-bottom)) !important; background: var(--white); border-radius: 26px 26px 0 0; border: 3px solid var(--navy); border-bottom: 0; padding: 20px 18px 26px; display: grid; gap: 12px; }
.modal-card h3 { font-size: 30px; }
.modal-card ol { margin: 0; padding-inline-start: 22px; display: grid; gap: 6px; }
/* the home page in «الفسحة»: cream yard, navy ink, the yellow bell block, printed cards with a hard shadow */
.hact { display: flex; align-items: center; gap: 8px; }
.hjoin { border: 3px solid var(--navy); background: var(--white); color: var(--navy); border-radius: 999px; padding: 6px 16px; font-weight: 700; min-height: 44px; box-shadow: 0 4px 0 var(--navy); white-space: nowrap; }
.hme { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--navy); background: var(--white); padding: 3px; display: grid; place-items: center; box-shadow: 0 4px 0 var(--navy); }
.hme .av { width: 100%; height: 100%; filter: none; }
.hjoin:active, .hme:active, .hchip:active, .hcode button:active { transform: translateY(3px); box-shadow: none; }
.hhero { background: var(--yard); border: 3px solid var(--navy); border-radius: 32px; box-shadow: 0 5px 0 var(--navy); padding: clamp(20px, 4vw, 40px); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 26px; align-items: center; position: relative; overflow: hidden; }
.hhero-t { display: grid; gap: 12px; justify-items: start; }
.hkick { font-weight: 700; font-size: 14px; opacity: .85; }
.hhero h1 { font-size: clamp(64px, 11vw, 116px); line-height: .95; color: var(--navy); }
.hhero .hlead { font-size: 17px; line-height: 1.6; max-width: 26em; }
.hcode { display: flex; gap: 8px; width: 100%; max-width: 340px; }
.hcode input { flex: 1; width: 0; min-width: 0; border: 3px solid var(--navy); border-radius: 14px; padding: 8px 12px; background: var(--white); color: var(--navy); font-family: var(--f-display); font-size: 24px; letter-spacing: .2em; text-align: center; direction: ltr; text-transform: uppercase; }
.hcode input::placeholder { color: #9aa3b8; }
.hcode button { flex: none; border: 0; border-radius: 14px; padding: 10px 20px; font-weight: 700; background: var(--navy); color: var(--yard); min-height: 48px; box-shadow: 0 4px 0 #0d162b; }
.hlinks { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.hlinks .passline, .hlinks .joinlink { margin: 0; font-size: 14.5px; }
.hlinks .ico { width: 22px; height: 22px; }
.hcrew { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; justify-items: center; }
.hcrew .av { width: 100%; max-width: 116px; height: auto; filter: drop-shadow(0 5px 4px rgba(0,0,0,.25)); }
.hcrew .av:nth-child(odd) { transform: translateY(14px); }
.hchips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 30px; }
.hchip { border: 3px solid var(--navy); background: var(--white); color: var(--navy); border-radius: 999px; padding: 6px 18px; font-weight: 700; min-height: 44px; box-shadow: 0 3px 0 var(--navy); }
.hchip[aria-pressed="true"] { background: var(--navy); color: var(--yard); }
.hcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; margin-top: 18px; }
.hcard { background: var(--white); border: 3px solid var(--navy); border-radius: 24px; overflow: hidden; box-shadow: 0 6px 0 var(--navy); display: flex; flex-direction: column; transition: transform .2s; }
.hcard:hover { transform: translateY(-3px); }
.hart { display: block; position: relative; border-bottom: 3px solid var(--navy); }
.hart > svg { display: block; width: 100%; height: auto; }
.hbadge { position: absolute; top: 7%; right: 4%; transform: rotate(8deg); background: var(--yard); color: var(--navy); border: 3px solid var(--navy); border-radius: 999px; font-family: var(--f-display); font-size: 18px; line-height: 1; padding: 6px 16px 3px; }
.hbody { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.hbody h3 { font-size: 28px; line-height: 1.1; }
.hbody p { font-size: 14.5px; color: #3c4a6b; line-height: 1.55; }
.htags { display: flex; flex-wrap: wrap; gap: 6px; }
.htags span { font-size: 12.5px; font-weight: 700; background: var(--cream); border: 1.5px solid #e8d9a8; border-radius: 999px; padding: 1px 10px; }
.hacts { display: grid; grid-template-columns: minmax(0, 1fr) 48px; gap: 8px; margin-top: auto; padding-top: 4px; }
.hplay { border: 0; border-radius: 14px; background: var(--navy); color: var(--yard); font-weight: 700; font-size: 16px; min-height: 48px; }
.hplay:disabled { background: #e9e3d6; color: #6b6450; cursor: default; }
.hinfo { border: 2px solid var(--navy); border-radius: 14px; background: var(--white); font-family: var(--f-display); font-size: 22px; color: var(--navy); min-height: 48px; padding-top: 3px; }
.hbody .passnote, .hbody .solo { align-self: center; }
.horg { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 3px solid var(--navy); border-radius: 22px; padding: 18px 22px; background: var(--navy); color: var(--cream); box-shadow: 0 5px 0 var(--navy); margin-top: 40px; }
.horg b { font-family: var(--f-display); font-weight: 400; font-size: 26px; display: block; color: var(--yard); }
.horg p { font-size: 15px; }
.horg a { border-radius: 14px; padding: 10px 20px; font-weight: 700; background: var(--yard); color: var(--navy); min-height: 48px; display: inline-flex; align-items: center; text-decoration: none; box-shadow: 0 4px 0 #b88a00; }
.hhow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 30px; }
.hstep { display: grid; grid-template-columns: 64px 1fr; gap: 12px; align-items: center; border: 3px dashed var(--navy); border-radius: 22px; padding: 12px 14px; }
.hstep .av { width: 64px; height: 64px; }
.hstep b { font-family: var(--f-display); font-weight: 400; font-size: 21px; display: block; line-height: 1.2; }
.hstep span { font-size: 14px; color: #4a5677; }
.foot { margin-top: 30px; padding-block: 12px 40px; border-top: 2px dashed var(--navy); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: #4a5677; }
.htip { display: flex; align-items: center; gap: 10px; background: var(--white); border: 2px dashed var(--navy); border-radius: 16px; padding: 10px 14px; margin-bottom: 14px; font-size: 14.5px; font-weight: 600; }
.htip p { flex: 1; }
.htip .ico { width: 28px; height: 28px; }
.htip button { border: 0; background: none; color: var(--navy); font-weight: 700; text-decoration: underline; text-underline-offset: 4px; min-height: 44px; padding: 0 4px; }
@media (max-width: 860px) { .hhero, .hhow { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 560px) { .hcards { grid-template-columns: minmax(0, 1fr); } .hchips { flex-wrap: nowrap; overflow-x: auto; margin-inline: -16px; padding: 2px 16px 6px; scrollbar-width: none; } .hchip { flex: none; } .logo { font-size: 30px; } .hjoin { padding-inline: 12px; } }


/* ================= شاشة العرض (js/tv.js): a 1600×900 stage zoomed to fill the TV ================= */
#tv { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; }
#tv[hidden] { display: none !important; }
.tv-stage { width: 1600px; height: 900px; zoom: var(--tvz, 1); display: grid; grid-template-rows: auto minmax(0, 1fr); padding: 28px 44px 36px; gap: 18px; }
.tv-top { display: flex; align-items: center; gap: 24px; }
.tv-brand { display: flex; align-items: center; gap: 12px; font-family: var(--f-display); font-size: 40px; line-height: 1; }
.tv-brand svg { width: 44px; height: 44px; }
.tv-stage svg[viewBox="0 0 40 40"] :is(path[fill], circle) { fill: currentColor; }
.tv-brand span { font-family: var(--f-body); font-weight: 700; font-size: 26px; opacity: .75; padding-inline-start: 16px; border-inline-start: 3px solid currentColor; }
.tv-join { margin-inline-start: auto; display: flex; align-items: center; gap: 16px; font-size: 18px; line-height: 1.35; text-align: end; }
.tv-join b { font-family: var(--f-display); font-size: 54px; letter-spacing: .12em; line-height: 1; }
.tv-qr { width: 86px; background: #fff; border-radius: 10px; padding: 5px; }
.tv-qr svg, .tv-bigqr svg { display: block; width: 100%; height: auto; }
.tv-x { width: 52px; height: 52px; border-radius: 16px; border: 2px solid currentColor; background: transparent; color: inherit; font-size: 28px; opacity: .55; }
.tv-top .tv-join + .tv-x { margin-inline-start: 0; }
.tv-top .tv-brand + .tv-x { margin-inline-start: auto; }
.tv-body { min-height: 0; display: grid; overflow: hidden; }
.tv-body.in > * { animation: tvin .45s ease-out both; }
@keyframes tvin { from { opacity: 0; transform: translateY(18px); } }
.tv-dim { opacity: .7; font-size: 22px; }
.tv-card { border-radius: 26px; padding: 28px 32px; background: color-mix(in srgb, currentColor 7%, transparent); border: 3px solid color-mix(in srgb, currentColor 30%, transparent); }
.tv-row { display: flex; gap: 16px; justify-content: center; }
.tv-btn { border: 3px solid currentColor; background: transparent; color: inherit; border-radius: 18px; padding: 14px 30px; font-size: 24px; font-weight: 700; }
.tv-bar { height: 16px; border-radius: 99px; background: color-mix(in srgb, currentColor 18%, transparent); overflow: hidden; }
.tv-bar i { display: block; height: 100%; background: currentColor; transform-origin: right; transition: transform .2s linear; }
.tv-secs { font-family: var(--f-display); font-size: 64px; line-height: 1; }
.tv-faces { display: flex; flex-wrap: wrap; gap: 14px 18px; }
.tv-p { display: grid; justify-items: center; gap: 4px; width: 84px; }
.tv-p small { font-size: 16px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tv-teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 18px; }
.tv-team { color: var(--c); border: 3px dashed var(--c); border-radius: 22px; padding: 14px 18px; display: grid; gap: 10px; align-content: start; }
.tv-team h3 { font-size: 30px; }
.tv-team .tv-p small { color: inherit; }
.tv-msg { display: grid; place-content: center; justify-items: center; gap: 18px; text-align: center; grid-row: 1 / -1; }
.tv-msg h1 { font-size: 72px; } .tv-msg p { font-size: 28px; opacity: .75; }
.tv-bell svg { width: 110px; height: 110px; }
.tv-plain { display: grid; place-content: center; justify-items: center; gap: 24px; text-align: center; }
.tv-plain h1 { font-size: 96px; } .tv-plain p { font-size: 30px; opacity: .75; } .tv-plain .tv-teams { width: 1000px; }
/* «وينكم!» */
.tv-lobby { display: grid; grid-template-columns: 560px minmax(0, 1fr); gap: 40px; min-height: 0; }
.tv-door { display: grid; justify-items: center; align-content: center; gap: 14px; text-align: center; }
.tv-door h1 { font-size: 84px; }
.tv-bigqr { width: 330px; background: #fff; border-radius: 22px; padding: 14px; }
.tv-door p { font-size: 24px; line-height: 1.5; opacity: .8; }
.tv-code { font-family: var(--f-display); font-size: 120px; letter-spacing: .18em; line-height: 1; }
.tv-side { display: grid; align-content: start; gap: 14px; min-height: 0; overflow: hidden; }
.tv-side h2 { font-size: 64px; } .tv-side h3 { font-size: 30px; margin-top: 10px; }
.tv-rules { list-style: arabic-indic; margin: 0; padding-inline-start: 30px; display: grid; gap: 8px; font-size: 23px; line-height: 1.45; }
.joinbox { display: block; max-width: 380px; margin-top: 18px; background: var(--white); border: 3px solid var(--navy); border-radius: 18px; padding: 12px 14px; box-shadow: 0 4px 0 var(--navy); }
.joinbox label { display: block; font-weight: 700; font-size: 15px; margin-bottom: 8px; }
.joinrow { display: flex; gap: 8px; }
.joinbox .joinrow input { background: var(--cream); }
.joinbox input::placeholder { font-family: var(--f-body); font-size: 17px; font-weight: 500; letter-spacing: 0; text-transform: none; color: #7d879c; }
.joinlink, .passline { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; color: var(--navy); font-weight: 700; font-size: 15px; cursor: pointer; text-align: start; }
.joinlink { margin-top: 12px; }
.passline { margin-top: 16px; }
.passline span, .joinlink { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 5px; }
.ico { width: 26px; height: 26px; flex: none; }
#tvHow { display: inline-flex; align-items: center; gap: 6px; } #tvHow .ico { width: 20px; height: 20px; }
.tvlink { display: block; margin-top: 10px; border: 0; background: none; padding: 0; color: inherit; font-size: 14.5px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; opacity: .85; text-align: start; }

/* خط ثلاثة on the TV: the phone's own board and cards, zoomed */
.tvk { display: flex; align-items: center; justify-content: center; gap: 48px; min-height: 0; }
.tvk-board { width: 400px; zoom: 1.2; display: grid; gap: 12px; } .tvk-board.big { width: 460px; zoom: 1.55; }
.tvk-board .k-sq { font-size: 15px; } .tvk .k-cat { justify-self: start; }
.tvk-side { width: 420px; zoom: 1.55; display: grid; gap: 14px; } .tvk-side.wide { width: 600px; zoom: 1.4; }
.tvk-side .k-q { font-size: 26px; } .tvk-side .tv-secs { font-size: 34px; color: var(--chalk-y); } .tvk-side .tv-bar { height: 8px; color: var(--chalk-y); }

/* ترابيع on the TV */
.tvt { display: flex; align-items: center; justify-content: center; gap: 44px; min-height: 0; }
.tvt-board { width: 440px; zoom: 1.6; } .tvt-side { width: 420px; zoom: 1.5; display: grid; gap: 12px; } .tvt-side.ask { width: 500px; zoom: 1.25; gap: 10px; }
.tvt-side .tr-q { font-size: 21px; } .tvt-side .tv-secs { font-size: 30px; } .tvt-side .tv-bar { height: 8px; } .tv-clock { font-family: var(--f-display); }

/* حرب الكراريس on the TV: the question up top, every fort in a row */
.tvh { width: 1000px; zoom: 1.5; justify-self: center; display: grid; gap: 14px; align-content: center; }
.tvh-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; } .tvh-top:has(> :only-child) { justify-content: center; }
.tvh-clock { font-weight: 700; } .tvh .tv-secs { font-size: 34px; }
.tvh-q { padding: 14px 18px; } .tvh-q .hz-qt { font-size: 22px; } .tvh .tv-bar { height: 8px; margin-block: 8px; }
.tvh-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tvh-forts { display: flex; gap: 14px; justify-content: center; }
.tvh-fort { flex: 1; max-width: 240px; display: grid; gap: 6px; justify-items: center; } .tvh-fort .hz-grid { width: 100%; } .tvh-fort.out { opacity: .5; } .tvh-fort.on .hz-chip { box-shadow: 0 0 0 3px #ffc933; }
.tvh-pts { font-family: var(--f-display); font-size: 22px; }
.tvh-ready { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 12px; }
.tvh-r { border: 2px dashed var(--pen); border-radius: 16px; padding: 12px; display: grid; gap: 8px; justify-items: center; }
.tvh-hint { text-align: center; opacity: .75; }
.tvh-order { display: flex; flex-wrap: wrap; gap: 10px 18px; justify-content: center; font-weight: 700; }
.tvh-feed { max-height: 230px; overflow: hidden; }

/* مين الغشاش؟ on the TV: the exam paper, and the classes side by side */
.tvg { width: 1040px; zoom: 1.42; justify-self: center; display: grid; gap: 12px; align-content: center; }
.tvg .gh-qt { font-size: 24px; } .tvg .gh-qn { align-items: center; } .tvg .tv-secs { font-size: 32px; margin-inline-start: auto; } .tvg .tv-bar { height: 8px; margin-block: 8px; }
.tvg-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tvg-cls { display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 12px; align-items: start; }

/* خلّصت! on the TV */
.tvk2 { width: 1100px; zoom: 1.35; justify-self: center; display: grid; gap: 14px; align-content: center; }
.tvk2.center { justify-items: center; text-align: center; } .tvk2.dense { zoom: 1.05; width: 1400px; } .tvk2.denser { zoom: .85; width: 1730px; }
.tvk2-big { width: 220px; height: 220px; font-size: 170px; } h1.tvk2-big { width: auto; height: auto; font-size: 96px; }
.tvk2-cats { font-size: 26px; font-weight: 700; }
.tvk2-head { display: flex; align-items: center; gap: 16px; font-size: 22px; } .tvk2-head .ring { margin-inline-start: auto; } .tvk2-head .tv-secs { font-size: 46px; }
.tvk2 .banner .tv-secs { font-size: 44px; } .tvk2 .ink .tv-bar { height: 10px; color: var(--ink-red); }
.tvk2-strip { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; } .tvk2-strip .tv-p { position: relative; }
.tvk2-strip .ok { position: absolute; top: -6px; inset-inline-end: 4px; background: #1f8a53; color: #fff; border-radius: 50%; width: 26px; height: 26px; display: grid; place-items: center; font-weight: 700; }

/* voting */

/* results */

/* ---- حرب الكراريس lives on squared exercise-book paper: pieces in each team's colour, hits in red pen, misses in pencil ---- */
body[data-theme="hisn"] {
  --desk: #fbfdff; --desk-2: #ffffff; --desk-3: #eef3fb; --line: #a9c4e2; --chalk: #1b2a4a; --muted: #5d6887; --soft: #3b4766;
  --marker: #1b2a4a; --marker-deep: #0d162b; --marker-ink: #ffc933; --paper: #ffffff; --rule: #cfe0f2; --margin: #e46b6b; --ink: #1b2a4a; --ink-blue: #1d3fb8; --ink-red: #c8232c; --ok: #1f8a53; --gain: #1f8a53; --sel: #ffc933;
  background-color: #fbfdff; background-image: linear-gradient(#cfe0f2 1px, transparent 1px), linear-gradient(90deg, #cfe0f2 1px, transparent 1px); background-size: 18px 18px;
  color: var(--chalk);
}
body[data-theme="hisn"] .gtop { border-bottom: 2px solid var(--ink); margin-bottom: 8px; background: #fbfdff; }
.hz-h { font-family: var(--f-display); font-size: 26px; line-height: 1.15; }
.hz-pen { font-family: "Aref Ruqaa", var(--f-display); font-weight: 700; color: #c8232c; font-size: 19px; line-height: 1.35; margin: 0; }
.hz-card { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.hz-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.hz-row2 { display: flex; gap: 8px; } .hz-row2 > * { flex: 1; }
.hz-clock { font-family: var(--f-display); font-size: 20px; color: #c8232c; white-space: nowrap; }
.hz-mates { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.hz-mates .av { flex: none; }
.hz-chip { display: inline-flex; align-items: center; gap: 5px; font: 700 13px var(--f-body); color: var(--pen); border: 2px solid var(--pen); border-radius: 999px; padding: 1px 10px; background: #fff; white-space: nowrap; }
.hz-chip::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--pen); flex: none; }
.hz-chip b { font-family: var(--f-display); font-weight: 400; font-size: 15px; color: var(--ink); }
.hz-chip small { font-size: 11px; }
button.hz-chip { cursor: pointer; }
.hz-chip.on { background: var(--pen); color: #fff; } .hz-chip.on::before { background: #fff; } .hz-chip.on b { color: #fff; }
.hz-chip.out { opacity: .45; text-decoration: line-through; }
.hz-teams { display: flex; flex-wrap: wrap; gap: 6px; }
.hz-grid { display: grid; gap: 0; background: #fff; border: 2.5px solid var(--pen); border-radius: 4px; padding: 3px; width: min(100%, 52dvh); align-self: center; }
.hz-grid.small { width: min(72%, 34dvh); }
.hz-lab { font-size: 10px; font-weight: 700; color: var(--muted); display: grid; place-items: center; padding: 2px 0; }
.hz-cell { aspect-ratio: 1; position: relative; display: grid; place-items: center; border: 1px solid #a9c4e2; margin: -.5px; background: transparent; padding: 0; color: var(--pen); cursor: default; }
.hz-cell .hz-ic { width: 88%; height: 88%; }
.hz-cell.pc { background: color-mix(in srgb, var(--pen) 9%, #fff); }
.hz-cell.guard { background-image: repeating-linear-gradient(45deg, transparent 0 5px, color-mix(in srgb, var(--pen) 22%, transparent) 5px 6.5px); }
.hz-cell.can { cursor: crosshair; }
.hz-cell.can:hover { background-color: #fff7d6; }
.hz-cell.aim { background: #ffc933 !important; outline: 3px solid var(--ink); outline-offset: -3px; z-index: 1; }
.hz-cell.hit, .hz-cell.wnd, .hz-cell.dead { background: rgba(200,35,44,.08); }
.hz-cell.hit .hz-ic, .hz-cell.dead .hz-ic { opacity: .5; }
.hz-cell.spot { outline: 2px dashed #c8232c; outline-offset: -3px; }
.hz-cell.broke .hz-stk .hz-ic:first-child, .hz-cell.broke > .hz-ic { opacity: .3; }
.hz-cell.radar { background: #e9fff1; outline: 2px solid #1f8a53; outline-offset: -3px; }
.hz-x { position: absolute; inset: 14%; width: 72%; height: 72%; }
.hz-dot { width: 30%; height: 30%; border-radius: 50%; background: #6b7280; }
.hz-ic.blk { width: 60%; height: 60%; color: #c9cfdb; }
.hz-ic { display: block; }
.hz-stk { position: absolute; inset: 0; }
.hz-stk .hz-ic { position: absolute; width: 64% !important; height: 64% !important; }
.hz-stk.n2 .hz-ic:nth-child(1) { top: 3%; right: 3%; } .hz-stk.n2 .hz-ic:nth-child(2) { bottom: 3%; left: 3%; }
.hz-stk.n3 .hz-ic { width: 54% !important; height: 54% !important; }
.hz-stk.n3 .hz-ic:nth-child(1) { top: 2%; right: 2%; } .hz-stk.n3 .hz-ic:nth-child(2) { top: 24%; left: 23%; } .hz-stk.n3 .hz-ic:nth-child(3) { bottom: 2%; left: 2%; }
.hz-cnt { position: absolute; bottom: 1px; right: 2px; font: 400 11px var(--f-display); background: var(--ink); color: #ffc933; border-radius: 6px; min-width: 15px; height: 15px; display: grid; place-items: center; padding-top: 2px; z-index: 2; }
.hz-tray { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.hz-piece { display: grid; justify-items: center; gap: 0; width: 64px; border: 2px dashed var(--pen); border-radius: 12px; background: #fff; padding: 4px 2px; color: var(--pen); font: 700 11px var(--f-body); }
.hz-piece .hz-ic { width: 34px; height: 34px; }
.hz-piece span { color: var(--ink); }
.hz-piece b { font-family: var(--f-display); font-weight: 400; font-size: 15px; color: var(--ink); line-height: 1; }
.hz-piece[aria-pressed="true"] { border-style: solid; background: #ffc933; }
.hz-piece:disabled { opacity: .35; }
.hz-q { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 12px; display: grid; gap: 8px; box-shadow: 0 4px 0 var(--ink); }
.hz-kind { justify-self: start; font-size: 12px; font-weight: 700; border: 2px solid var(--ink); border-radius: 999px; padding: 0 10px; background: #ffc933; }
.hz-qt { font-size: 18.5px; font-weight: 700; line-height: 1.5; }
.hz-timer { height: 7px; border-radius: 6px; background: #e3eaf3; border: 1.5px solid var(--ink); overflow: hidden; }
.hz-timer i { display: block; height: 100%; background: #c8232c; transform-origin: right; transition: transform .25s linear; }
.hz-opt { position: relative; overflow: hidden; border: 2px solid var(--ink); border-radius: 11px; padding: 8px 12px; font: 700 15.5px var(--f-body); color: var(--ink); background: #fff; display: flex; justify-content: space-between; text-align: start; width: 100%; }
.hz-opt i { position: absolute; inset-block: 0; inset-inline-start: 0; transition: width .4s ease; }
.hz-opt span, .hz-opt small { position: relative; } .hz-opt small { color: var(--muted); }
.hz-opt[aria-pressed="true"] { border-color: #1d3fb8; background: #eef3ff; }
.hz-opt.gone { opacity: .4; text-decoration: line-through; }
.hz-opt:disabled { cursor: default; }
.hz-hv { display: inline-flex; align-items: center; gap: 1px; } .hz-hv .hz-ic { width: 16px; height: 16px; }
/* the shot lands: a burst on the square, shards, and the grid shakes */
.hz-cell.boom { z-index: 3; }
.hz-burst { position: absolute; inset: -70%; pointer-events: none; border-radius: 50%; background: radial-gradient(circle, #fffbe6 0 10%, #ffc933 11% 28%, #e5484d 29% 44%, rgba(229,72,77,0) 46%); animation: hzBurst .8s ease-out both; }
.hz-burst::after { content: ""; position: absolute; left: 46%; top: 46%; width: 8%; height: 8%; border-radius: 50%; background: #1b2a4a; box-shadow: 0 -2.4em #e5484d, 1.7em -1.7em #ffc933, 2.4em 0 #1b2a4a, 1.7em 1.7em #e5484d, 0 2.4em #ffc933, -1.7em 1.7em #1b2a4a, -2.4em 0 #e5484d, -1.7em -1.7em #ffc933; animation: hzShards .8s ease-out both; }
@keyframes hzBurst { 0% { transform: scale(.1); opacity: 1; } 55% { opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
@keyframes hzShards { 0% { transform: scale(.2); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
.hz-grid.shake { animation: hzShake .5s .12s; overflow: visible; }
@keyframes hzShake { 0%, 100% { transform: translate(0); } 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -4px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
@media (prefers-reduced-motion: reduce) { .hz-burst, .hz-burst::after, .hz-grid.shake { animation-duration: .01s; } }
/* the ink pen on the squared paper: blue-ink handwriting, sticky notes with tape, a wobbly hand-drawn grid,
   a fat red marker X and, for the shot, an ink splat that soaks in */
body[data-theme="hisn"] .hz-qt { font-family: "Aref Ruqaa", var(--f-display); color: #1d3fb8; font-size: 22px; line-height: 1.55; }
body[data-theme="hisn"] .hz-banner { background: #ffe27a; color: var(--ink); border: 2.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); transform: rotate(-1deg); position: relative; margin-top: 6px; }
body[data-theme="hisn"] .hz-banner::before { content: ""; position: absolute; top: -10px; left: 42%; width: 64px; height: 18px; background: rgba(190, 220, 255, .8); transform: rotate(4deg); }
body[data-theme="hisn"] .hz-banner b { color: var(--pen); font-size: 28px; }
body[data-theme="hisn"] .hz-grid { filter: url(#hz-rough); }
body[data-theme="hisn"] .hz-cell { border-color: #7fa3cf; }
body[data-theme="hisn"] .hz-dot { width: 26%; height: 26%; background: #1d3fb8; box-shadow: 1.5px 1px 0 rgba(29, 63, 184, .35); }
body[data-theme="hisn"] .hz-x { inset: 8%; width: 84%; height: 84%; }
body[data-theme="hisn"] .hz-opt { border-radius: 5px 14px 6px 12px; }
body[data-theme="hisn"] .hz-opt[aria-pressed="true"] { border-color: #1d3fb8; background: #e7efff; box-shadow: 3px 3px 0 #1d3fb8; }
body[data-theme="hisn"] .hz-chip.on { background: #ffe27a; color: var(--pen); box-shadow: 2px 2px 0 var(--ink); }
body[data-theme="hisn"] .hz-chip.on::before { background: var(--pen); } body[data-theme="hisn"] .hz-chip.on b { color: var(--ink); }
body[data-theme="hisn"] .hz-fire { font-family: var(--f-display); font-weight: 400; font-size: 26px; transform: rotate(-.6deg); box-shadow: 4px 4px 0 var(--ink); background: #c8232c; color: #fff; border: 2.5px solid var(--ink); }
body[data-theme="hisn"] .hz-fire:disabled { background: #e9b8bb; }
.tvh-hit { max-width: 900px; width: 60%; }
.hz-hitcard { text-align: center; background: #fffdf3; border: 2.5px solid var(--ink); box-shadow: 4px 4px 0 #c8232c; transform: rotate(1deg); border-radius: 16px; padding: 10px; display: grid; gap: 2px; }
.hz-hitcard small { font-size: 13px; color: var(--muted); } .hz-hitcard b { font-family: var(--f-display); font-weight: 400; font-size: 38px; line-height: 1.1; color: #c8232c; }
.hz-hitcard.miss b, .hz-hitcard.none b, .hz-hitcard.late b { color: #1d3fb8; } .hz-hitcard.blk b { color: #4b5563; }
.hz-hitcard em { font-style: normal; font-family: var(--f-display); font-size: 26px; color: #1f8a53; }
.tvh-hit { align-self: center; min-width: 520px; } .tvh-hit .hz-hitcard b { font-size: 64px; } .tvh-hit .hz-hitcard small { font-size: 20px; } .tvh-hit .hz-hitcard em { font-size: 38px; }
body[data-theme="hisn"] .hz-burst { inset: -80%; border-radius: 0; background: radial-gradient(circle, #1b2a4a 0 6%, transparent 7%), radial-gradient(closest-side, #c8232c 0 32%, rgba(200, 35, 44, .6) 33% 46%, transparent 47%); filter: url(#hz-splat); animation: hzInk 1s ease-out both; }
body[data-theme="hisn"] .hz-burst::after { background: #c8232c; box-shadow: 0 -2.6em #1b2a4a, 1.8em -1.6em #c8232c, 2.5em .3em #c8232c, 1.5em 1.9em #1b2a4a, -.2em 2.6em #c8232c, -1.9em 1.5em #c8232c, -2.6em -.2em #1b2a4a, -1.6em -1.9em #c8232c; animation: hzDrops .9s ease-out both; }
@keyframes hzInk { 0% { transform: scale(.15) rotate(-25deg); opacity: 1; } 40% { transform: scale(1.05) rotate(0); opacity: .95; } 100% { transform: scale(.8); opacity: .3; } }
@keyframes hzDrops { 0% { transform: scale(.2); opacity: 1; } 60% { opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
.hz-faces { display: flex; gap: 2px; flex-wrap: wrap; }
.hz-order { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; }
.hz-banner { background: var(--pen); color: #fff; border-radius: 14px; padding: 8px 12px; text-align: center; display: grid; gap: 2px; border: 2px solid var(--ink); }
.hz-banner b { font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.hz-banner span { font-size: 13px; }
.hz-fire { font-size: 18px; }
.hz-feed { display: grid; gap: 6px; }
.hz-ev { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; font-size: 13px; }
.hz-ev .hz-chip { font-size: 11.5px; padding: 0 7px; }
.hz-ev .hz-ic { width: 24px; height: 24px; color: #1b2a4a; }
.hz-what { display: inline-flex; align-items: center; gap: 3px; font-weight: 700; }
.hz-sq { font-family: var(--f-display); font-weight: 400; font-size: 15px; }
.hz-ev b.p { margin-inline-start: auto; font-family: var(--f-display); font-weight: 400; font-size: 18px; color: #1f8a53; }
.hz-ev.boom { border-color: #c8232c; background: #fff5f5; }
.hz-ev.dead { border-color: #c8232c; background: #fff0f0; }
.hz-full { flex-basis: 100%; }
.hz-stamp { align-self: center; font-family: "Aref Ruqaa", var(--f-display); font-weight: 700; color: #c8232c; font-size: 32px; line-height: 1.1; border: 3px solid #c8232c; border-radius: 10px; padding: 6px 16px 2px; transform: rotate(-6deg); background: #fff; animation: pop .4s ease-out; text-align: center; }
.hz-radar { background: #e9fff1; border: 2px solid #1f8a53; border-radius: 12px; padding: 6px 10px; font-size: 14px; text-align: center; }
.hz-podium { display: flex; align-items: flex-end; justify-content: center; gap: 6px; height: 86px; }
.hz-podium div { width: 64px; border: 2px solid var(--ink); border-bottom: 0; border-radius: 8px 8px 0 0; display: grid; place-items: start center; padding-top: 3px; font-family: var(--f-display); color: #fff; font-size: 19px; }
.hz-ranks { display: grid; gap: 6px; }
.hz-rk { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; background: #fff; border: 2px solid var(--ink); border-radius: 12px; padding: 6px 10px; }
.hz-rk.me { background: #fff7d6; }
.hz-rk .n { font-family: var(--f-display); font-size: 18px; color: var(--muted); text-align: center; }
.hz-rk b { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.hz-aw { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; padding: 4px 2px; border-bottom: 1px dashed #a9c4e2; }
.hz-aw b { color: #c8232c; }
.hz-all { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.hz-all > div { display: grid; gap: 4px; justify-items: start; }
.hz-all .hz-grid.small { width: 100%; }
.gart.squared { background-color: #fbfdff; background-image: linear-gradient(#cfe0f2 1px, transparent 1px), linear-gradient(90deg, #cfe0f2 1px, transparent 1px); background-size: 14px 14px; }
/* ---- مين الغشاش؟ lives on the vice principal's cork board: pinned case cards, sticky notes, polaroids of the suspects, red string ---- */
body[data-theme="ghash"] {
  --desk: #c08a52; --desk-2: #fffdf5; --desk-3: #ecd6b0; --line: #8a5f36; --chalk: #2b1a0e; --muted: #4a3020; --soft: #3b2414;
  --marker: #2b1a0e; --marker-deep: #0f0904; --marker-ink: #ffd36b; --paper: #fffdf5; --rule: #e6d7bd; --ink: #2b1a0e; --ok: #1f7a46; --gain: #1f7a46; --sel: #ffd36b;
  --red: #b3121c; --pen: #b3121c;
  background-color: #c08a52;
  background-image: radial-gradient(rgba(92,56,24,.5) 1px, transparent 1.6px), radial-gradient(rgba(255,236,200,.38) 1px, transparent 1.5px), radial-gradient(rgba(120,72,32,.32) 2px, transparent 2.8px);
  background-size: 7px 7px, 11px 11px, 23px 23px; background-position: 0 0, 3px 5px, 9px 2px;
  color: var(--chalk);
}
body[data-theme="ghash"] .gtop { background: linear-gradient(#7a4f2a, #5b391c); color: #ffe9c4; border-radius: 10px; padding: 8px 10px; margin-bottom: 14px; box-shadow: 0 3px 0 #3e2510, 0 6px 12px rgba(40,20,5,.3); }
body[data-theme="ghash"] .gtop .gt { color: #ffd36b; font-size: 19px; }
.gh-h { font-family: var(--f-display); font-size: 28px; line-height: 1.15; }
.gh-pen { font-family: "Aref Ruqaa", var(--f-display); font-weight: 700; color: #7d0d14; font-size: 18px; line-height: 1.4; margin: 0; text-align: center; }
/* a case card pinned to the board */
.gh-paper, .gh-res, .gh-cl { position: relative; background: #fffdf5; border-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,.25), 3px 8px 14px rgba(40,20,5,.35); }
.gh-paper { padding: 22px 14px 14px; display: grid; gap: 10px; transform: rotate(-.4deg); border-top: 3px solid #c8232c; }
.gh-paper::before, .gh-res::before { content: ""; position: absolute; top: -9px; left: 50%; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: radial-gradient(circle at 35% 32%, rgba(255,255,255,.75), transparent 34%), var(--pin, #c8232c); box-shadow: 1px 3px 3px rgba(0,0,0,.4); z-index: 1; }
.gh-form { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); border-bottom: 1.5px solid #ead9bd; padding-bottom: 8px; }
.gh-form b { color: var(--ink); font-family: "Aref Ruqaa", var(--f-display); font-size: 16px; }
.gh-me { display: flex; align-items: center; gap: 8px; }
.gh-faces { display: inline-flex; flex-wrap: wrap; gap: 3px; align-items: center; }
.gh-faces .av { flex: none; background: #fff; padding: 2px 2px 5px; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.gh-me .gh-faces .av { box-shadow: 0 1px 3px rgba(0,0,0,.4); }
.gh-chip { display: inline-flex; align-items: center; gap: 5px; font: 700 13px var(--f-body); color: var(--pen); border: 2px solid var(--pen); border-radius: 4px; padding: 1px 9px; background: #fff; white-space: nowrap; }
.gh-chip.on { background: var(--pen); color: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); }
.gh-board { display: flex; gap: 6px; flex-wrap: wrap; }
.gh-sc { display: inline-flex; gap: 6px; align-items: center; font: 700 13px var(--f-body); color: var(--pen); border-top: 3px solid var(--pen); border-radius: 2px; padding: 1px 8px; background: #fffdf5; box-shadow: 0 2px 4px rgba(40,20,5,.3); }
.gh-sc b { font-family: var(--f-display); font-weight: 400; font-size: 16px; color: var(--ink); }
.gh-sc.me { transform: rotate(-2deg) scale(1.06); }
.gh-qn { display: flex; align-items: baseline; gap: 8px; }
.gh-qn span { font-family: "Aref Ruqaa", var(--f-display); font-weight: 700; font-size: 22px; color: #c8232c; }
.gh-qn small { color: var(--muted); font-size: 12px; }
.gh-qt { font-family: var(--f-display); font-size: 25px; line-height: 1.3; }
/* the clock is a red string running out */
.gh-timer { height: 4px; background: rgba(43,26,14,.12); border-radius: 99px; overflow: hidden; }
.gh-timer i { display: block; height: 100%; background: #b3121c; transform-origin: right; transition: transform .2s linear; }
/* the options are sticky notes */
.gh-opts { display: grid; gap: 10px; }
.gh-opt { --note: #fff2a1; display: flex; align-items: center; gap: 12px; text-align: start; font: 700 17px var(--f-body); color: var(--ink); background: var(--note); border: 0; border-radius: 2px; padding: 11px 12px; cursor: pointer; box-shadow: 0 1px 1px rgba(0,0,0,.15), 2px 5px 8px rgba(60,40,10,.25); transform: rotate(-.6deg); }
.gh-opt:nth-child(2) { --note: #ffd0dc; transform: rotate(.5deg); } .gh-opt:nth-child(3) { --note: #cdf0c4; transform: rotate(-.3deg); } .gh-opt:nth-child(4) { --note: #cbe4ff; transform: rotate(.7deg); }
.gh-opt i, .gh-mk i { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--ink); background: rgba(255,255,255,.7); color: var(--ink); display: grid; place-items: center; font: 700 14px var(--f-body); font-style: normal; }
.gh-opt[aria-pressed="true"] { outline: 3px solid #b3121c; outline-offset: 4px; border-radius: 3px; }
.gh-opt[aria-pressed="true"] i { background: #b3121c; border-color: #b3121c; color: #fff; }
.gh-opt:disabled { cursor: default; opacity: .85; }
/* the private note is a sealed manila envelope; everyone has one */
.gh-note { position: relative; width: 100%; min-height: 128px; border: 0; padding: 0; background: none; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.gh-note.big { min-height: 170px; }
.gh-fold, .gh-in { position: absolute; inset: 0; display: grid; place-content: center; gap: 4px; text-align: center; border-radius: 3px; padding: 10px; }
.gh-fold { background: linear-gradient(162deg, #d6b277 0 47%, transparent 47.5%) top / 100% 52% no-repeat, linear-gradient(18deg, transparent 52.5%, #d6b277 53%) top / 100% 52% no-repeat, #e4c58d; color: #4a3020; font: 700 15px var(--f-body); transform: rotate(-1deg); box-shadow: 0 1px 2px rgba(0,0,0,.25), 3px 8px 14px rgba(40,20,5,.35); padding-top: 34px; }
.gh-fold::after { content: "سري"; position: absolute; top: 10px; left: 16px; font: 700 18px "Aref Ruqaa", var(--f-display); color: #b3121c; border: 2px solid #b3121c; border-radius: 4px; padding: 0 10px; transform: rotate(-12deg); opacity: .85; }
.gh-fold small { font-weight: 500; color: #6a4a2c; font-size: 12px; }
.gh-in { background: #fffdf5; border-top: 3px solid #c8232c; box-shadow: 0 1px 2px rgba(0,0,0,.25), 3px 8px 14px rgba(40,20,5,.35); visibility: hidden; }
.gh-note.open .gh-in { visibility: visible; } .gh-note.open .gh-fold { visibility: hidden; }
.gh-n1 { font-family: "Aref Ruqaa", var(--f-display); font-weight: 700; color: #c8232c; font-size: 22px; }
.gh-n2 { font-family: var(--f-display); font-size: 22px; color: var(--ink); }
.gh-in small { color: var(--muted); font: 500 13px var(--f-body); }
.gh-classes { display: grid; gap: 8px; }
.gh-cl { display: flex; align-items: center; gap: 8px; border-inline-start: 5px solid var(--pen); padding: 7px 9px; }
.gh-cl small { margin-inline-start: auto; color: var(--muted); }
.gh-ans { font-size: 16px; } .gh-ans b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--ok); }
.gh-res { --pin: var(--pen); border-top: 4px solid var(--pen); padding: 14px 12px 10px; display: grid; gap: 8px; }
.gh-res:nth-of-type(even) { transform: rotate(.4deg); }
.gh-res > .gh-chip { justify-self: start; }
.gh-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.gh-stamp { font-family: "Aref Ruqaa", var(--f-display); font-weight: 700; font-size: 18px; color: var(--muted); border: 2px solid currentColor; border-radius: 4px; padding: 0 10px; transform: rotate(-4deg); white-space: nowrap; }
.gh-stamp.ok { color: #1f7a46; } .gh-stamp.no { color: #c8232c; }
.gh-stamp.big { font-size: 34px; color: #c8232c; justify-self: center; padding: 2px 18px; border-width: 3px; }
.gh-mk { display: flex; align-items: center; gap: 10px; padding: 5px 6px; border-radius: 3px; }
.gh-mk .t { flex: 1; font-weight: 700; font-size: 15px; }
.gh-mk.right { background: #e3f4e7; } .gh-mk.right i { background: #1f7a46; border-color: #1f7a46; color: #fff; }
.gh-mk.pick:not(.right) { background: #fde6e8; } .gh-mk.pick:not(.right) i { background: #b3121c; border-color: #b3121c; color: #fff; }
/* the suspects are polaroids; the vote is a red marker circle */
.gh-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 14px 10px; padding: 4px; }
.gh-pick button { position: relative; display: grid; justify-items: center; gap: 4px; padding: 7px 7px 6px; background: #fff; border: 0; border-radius: 2px; font: 700 15px "Aref Ruqaa", var(--f-display); color: var(--ink); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,.25), 2px 6px 10px rgba(40,20,5,.3); transform: rotate(-2deg); }
.gh-pick button:nth-child(even) { transform: rotate(1.8deg); } .gh-pick button:nth-child(3n) { transform: rotate(-.6deg); }
.gh-pick button .av { width: 100%; max-width: 74px; height: auto; background: #e9e2d2; }
.gh-pick button small { color: #c8232c; font: 700 11px var(--f-body); }
.gh-pick button[aria-pressed="true"]::after { content: ""; position: absolute; inset: -7px; border: 3px solid #c8232c; border-radius: 48% 52% 44% 56% / 56% 44% 56% 44%; transform: rotate(-5deg); pointer-events: none; }
.gh-acc { display: flex; align-items: center; gap: 12px; }
.gh-acc .av { background: #fff; padding: 4px 4px 12px; box-shadow: 0 1px 2px rgba(0,0,0,.25), 2px 6px 10px rgba(40,20,5,.3); transform: rotate(-3deg); }
.gh-acc b { font-family: var(--f-display); font-weight: 400; font-size: 22px; } .gh-acc span { color: var(--muted); font-size: 13px; }
.gh-votes { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: #b3121c; font-weight: 700; }
.gh-votes span { display: inline-flex; align-items: center; gap: 2px; }
.gh-ranks { display: grid; gap: 6px; }
.gh-rk { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 2px; background: #f6ecd8; }
.gh-rk.me { box-shadow: 0 0 0 2px var(--pen) inset; }
.gh-rk .n { font-family: var(--f-display); font-size: 20px; width: 20px; } .gh-rk small { color: var(--muted); margin-inline-start: auto; } .gh-rk b { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.gh-ch { display: flex; align-items: center; gap: 10px; }
.gh-ch .av { background: #fff; padding: 3px 3px 9px; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.gh-ch span { display: grid; } .gh-ch small { color: var(--muted); font-size: 12px; } .gh-ch i { margin-inline-start: auto; font-style: normal; font-family: var(--f-display); font-size: 20px; color: var(--muted); }
.gh-ch.free small { color: #c8232c; font-weight: 700; } .gh-ch.free i { color: #c8232c; }
.gh-aw { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1.5px dashed rgba(43,26,14,.4); padding: 6px 0; }
.gh-aw b { display: inline-flex; align-items: center; gap: 6px; color: #7d0d14; }
.gart.cork { background-color: #c08a52; background-image: radial-gradient(rgba(92,56,24,.5) 1px, transparent 1.6px), radial-gradient(rgba(255,236,200,.38) 1px, transparent 1.5px); background-size: 7px 7px, 11px 11px; background-position: 0 0, 3px 5px; }
/* ---- الكنز lives on a treasure map at dusk: deep pool-water night, sand-coloured cards, gold for what matters ---- */
body[data-theme="kanz"] {
  --desk: #0d2630; --desk-2: #143542; --desk-3: #1c4252; --line: #2d5a6a; --chalk: #fff6e4; --muted: #b9cfca; --soft: #d7e6e2;
  --marker: #f2b230; --marker-deep: #b07a12; --marker-ink: #2a1d10; --paper: #fffaf0; --ink: #2a1d10; --ok: #5fd38d; --gain: #5fd38d; --sel: #f2b230;
  --sand: #f2e1b6; --gold: #f2b230; --red: #d2402f;
  background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(242,178,48,.12), transparent 70%), #0d2630; color: var(--chalk);
}
body[data-theme="kanz"] .gtop .gt { color: var(--gold); }
.kz-h { font-family: var(--f-display); font-size: 28px; line-height: 1.15; color: var(--gold); }
.kz-row2 { display: flex; gap: 8px; flex-wrap: wrap; } .kz-row2 > * { flex: 1 1 140px; }
.kz-chip { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 13px; color: #fff; background: var(--c); border-radius: 999px; padding: 1px 10px; white-space: nowrap; }
.kz-beads { display: inline-flex; gap: 4px; } .kz-beads i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--c); } .kz-beads i.on { background: var(--c); }
.kz-team { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kz-clock { margin-inline-start: auto; font-family: var(--f-display); font-size: 22px; color: var(--gold); font-variant-numeric: tabular-nums; }
.kz-card-big { background: var(--desk-2); border-radius: 18px; padding: 16px; display: grid; gap: 12px; border-top: 5px solid var(--c, var(--gold)); }
.kz-big { font-size: 56px; text-align: center; line-height: 1; }
/* lobby places */
.kz-places { display: grid; gap: 6px; }
.kz-pl { display: grid; gap: 4px; background: var(--desk-2); border-radius: 12px; padding: 6px; border: 1.5px solid transparent; }
.kz-pl.on { border-color: var(--gold); }
.kz-pt { display: flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--chalk); font: 700 15px var(--f-body); text-align: start; cursor: pointer; padding: 2px 4px; }
.kz-pt span { font-size: 20px; } .kz-pt[aria-pressed="false"] { opacity: .55; }
.kz-pl small { color: var(--muted); padding-inline: 32px 4px; }
.kz-hide { width: 100%; border: 1.5px solid var(--line); background: var(--desk); color: var(--chalk); border-radius: 10px; padding: 7px 10px; font: 600 14px var(--f-body); }
/* printing step */
.kz-groups { display: grid; gap: 10px; }
.kz-group { background: var(--sand); color: var(--ink); border-radius: 14px; padding: 10px; display: grid; gap: 8px; }
.kz-gh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .kz-gh span { font-size: 22px; } .kz-gh b { font-size: 16px; } .kz-gh small { color: #6d5a3f; flex-basis: 100%; }
.kz-gc { display: flex; gap: 8px; flex-wrap: wrap; }
.kz-card { background: #fff; border-radius: 10px; border-top: 6px solid var(--c); padding: 6px; display: grid; justify-items: center; gap: 2px; width: 92px; font-size: 11px; font-weight: 700; color: var(--c); }
.kz-card .kz-qr svg { width: 72px; height: 72px; display: block; }
.kz-card b { font-family: ui-monospace, monospace; color: var(--ink); direction: ltr; letter-spacing: .08em; }
.kz-roles { display: grid; gap: 6px; }
.kz-rl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: rgba(255,255,255,.05); border-radius: 12px; padding: 6px 8px; border-inline-start: 4px solid var(--c); }
.kz-rl span { display: inline-flex; align-items: center; gap: 2px; }
.kz-role-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kz-role-pick button { display: grid; gap: 4px; justify-items: center; text-align: center; background: var(--desk); border: 2px solid var(--line); border-radius: 14px; padding: 12px 8px; color: var(--chalk); font: 700 15px var(--f-body); cursor: pointer; }
.kz-role-pick button span { font-size: 30px; } .kz-role-pick button small { font-weight: 500; font-size: 12px; color: var(--muted); }
.kz-role-pick button[aria-pressed="true"] { border-color: var(--gold); background: rgba(242,178,48,.12); }
/* the hunt */
.kz-tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--desk-2); border-radius: 12px; padding: 3px; }
.kz-tabs button { border: 0; background: none; border-radius: 9px; padding: 8px 4px; font: 700 14px var(--f-body); color: var(--muted); cursor: pointer; }
.kz-tabs button[aria-selected="true"] { background: var(--sand); color: var(--ink); }
.kz-cipher { background: var(--paper); color: var(--ink); border-radius: 16px; padding: 12px; display: grid; gap: 10px; text-align: center; }
.kz-cipher small { color: #6d5a3f; font-size: 12.5px; }
.kz-kind { justify-self: center; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 1px 10px; background: var(--ink); color: var(--gold); }
.kz-ctext { font-size: 28px; font-weight: 700; line-height: 1.6; word-break: break-word; }
.kz-lens { display: flex; justify-content: center; gap: 6px; } .kz-lens i { width: 18px; height: 4px; border-radius: 2px; background: var(--ink); } .kz-lens b { width: 14px; }
.kz-pad { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.kz-cell { display: grid; gap: 2px; justify-items: center; }
.kz-cell button { min-width: 40px; height: 40px; padding: 0 4px; border-radius: 10px; border: 2px solid var(--ink); background: #fff; font: 700 18px var(--f-body); color: var(--ink); cursor: pointer; }
.kz-cell button[aria-pressed="true"] { background: var(--gold); }
.kz-cell span { width: 40px; height: 32px; border-bottom: 3px solid var(--ink); display: grid; place-items: center; font-size: 22px; font-weight: 700; color: #1d3fb8; }
.kz-gap { width: 14px; }
.kz-kbd { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.kz-kbd button { border: 1px solid #d9c8a3; background: #fff; border-radius: 8px; padding: 7px 0; font: 700 17px var(--f-body); color: var(--ink); cursor: pointer; }
.kz-hint { background: rgba(242,178,48,.14); color: var(--gold); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 18px; text-align: center; letter-spacing: .1em; }
.kz-ans { display: flex; gap: 6px; } .kz-ans input { flex: 1; min-width: 0; border: 2px solid var(--sand); border-radius: 12px; padding: 10px 12px; font: 700 17px var(--f-body); background: var(--paper); color: var(--ink); } .kz-ans .btn { width: auto; padding-inline: 18px; }
.kz-lock { background: rgba(242,178,48,.16); color: var(--gold); border-radius: 12px; padding: 8px 12px; font-weight: 700; text-align: center; } .kz-lock b { font-family: var(--f-display); font-size: 20px; font-weight: 400; }
.kz-bad { background: rgba(210,64,47,.18); color: #ffb3a8; border-radius: 12px; padding: 8px 12px; font-weight: 700; text-align: center; }
.kz-solved { display: flex; align-items: center; gap: 12px; background: var(--sand); color: var(--ink); border-radius: 16px; padding: 12px 14px; }
.kz-solved > span { font-size: 40px; } .kz-solved small { display: block; color: #6d5a3f; } .kz-solved b { font-family: var(--f-display); font-size: 30px; font-weight: 400; display: block; line-height: 1.2; } .kz-solved em { display: block; font-style: normal; color: var(--red); font-weight: 700; }
.kz-seg { display: flex; gap: 6px; } .kz-seg button { flex: 1; border: 1.5px solid var(--sand); background: transparent; color: var(--sand); border-radius: 999px; padding: 5px; font: 700 13px var(--f-body); cursor: pointer; } .kz-seg button[aria-pressed="true"] { background: var(--sand); color: var(--ink); }
.kz-g28 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.kz-g28 span { display: grid; justify-items: center; background: var(--paper); color: var(--ink); border-radius: 8px; padding: 4px 0; font-size: 16px; font-weight: 700; line-height: 1.2; } .kz-g28 small { font-size: 12px; color: #6d5a3f; } .kz-g28 .lock { background: #3a5560; color: #9fb7b5; } .kz-g28 .lock small { color: #9fb7b5; }
.kz-wheel { display: grid; justify-items: center; gap: 8px; } .kz-wheel svg { width: 100%; max-width: 300px; height: auto; }
.kz-wctl { display: flex; gap: 12px; align-items: center; font-weight: 700; } .kz-wctl button { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--sand); background: transparent; color: var(--sand); font-size: 20px; cursor: pointer; }
.kz-cam { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 18px; overflow: hidden; background: radial-gradient(circle at 50% 45%, #3c4b4f, #121a1d); display: grid; place-items: center; }
.kz-cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; } .kz-cam.on video { opacity: 1; }
.kz-cam .kz-frame { position: absolute; inset: 18%; border: 4px solid var(--gold); border-radius: 18px; box-shadow: 0 0 0 999px rgba(0,0,0,.3); opacity: 0; } .kz-cam.on .kz-frame { opacity: 1; }
.kz-cam.on .btn { display: none; } .kz-cam .btn { width: auto; position: relative; }
.kz-cam p { position: absolute; bottom: 8px; inset-inline: 10px; text-align: center; font-size: 13px; color: #ffd0c8; }
/* the TV */
.kz-tv { background: #05141a; border-radius: 16px; overflow: hidden; }
.kz-tv:fullscreen { border-radius: 0; display: grid; grid-template-rows: auto 1fr; }
.kz-tvbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 14px; background: #0d2630; }
.kz-tvbar b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--gold); } .kz-tvbar span { font-family: var(--f-display); font-size: 22px; font-variant-numeric: tabular-nums; }
.kz-tvbody { display: grid; grid-template-columns: minmax(0, 1fr); background: #1a120a; }
@media (min-width: 760px) { .kz-tvbody { grid-template-columns: minmax(0, 1fr) 220px; } }
.kz-map { display: block; width: 100%; height: auto; } .kz-map text { font-family: var(--f-body); }
.kz-board { background: linear-gradient(#2a1b0e, #1a120a); color: #f6e7c8; padding: 12px; display: grid; gap: 8px; align-content: start; }
.kz-rb { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; background: rgba(255,255,255,.06); border-inline-start: 5px solid var(--c); border-radius: 10px; padding: 7px; }
.kz-rb .rk { font-family: var(--f-display); font-size: 24px; color: var(--gold); text-align: center; } .kz-rb b { font-size: 15px; } .kz-rb small { display: block; color: #cdb98f; font-size: 11.5px; }
.kz-feed { border-top: 1px dashed rgba(246,231,200,.3); padding-top: 6px; display: grid; gap: 3px; font-size: 12.5px; color: #e8d7b0; } .kz-feed p { margin: 0; }
@media (prefers-reduced-motion: no-preference) {
  .kz-pawn { animation: kzbob 2.4s ease-in-out infinite; } @keyframes kzbob { 50% { transform: translateY(-4px); } }
  .kz-map .flame { animation: kzflick .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom center; } @keyframes kzflick { to { transform: scaleY(1.12); opacity: .85; } }
  .kz-map .bulb { animation: kztw 2s ease-in-out infinite; } @keyframes kztw { 50% { opacity: .35; } }
  .kz-map .rayset { animation: kzspin 18s linear infinite; transform-box: fill-box; transform-origin: center; } @keyframes kzspin { to { transform: rotate(360deg); } }
  .kz-map .flagw { animation: kzwave 2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; } @keyframes kzwave { to { transform: skewY(-6deg) scaleX(.94); } }
}
.kz-map .bulb { filter: drop-shadow(0 0 4px #ffd25a); }
/* the end */
.kz-end { background: radial-gradient(ellipse at 50% 20%, #3a2a0e, #0d1316 70%); border-radius: 18px; padding: 20px 14px; display: grid; gap: 12px; }
.kz-treasure { background: var(--paper); color: var(--ink); border-radius: 14px; padding: 10px 14px; font-weight: 700; text-align: center; } .kz-treasure b { font-family: "Aref Ruqaa", var(--f-display); color: var(--red); font-size: 22px; }
.kz-ranks { display: grid; gap: 6px; }
.kz-rk { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: rgba(255,255,255,.06); border-inline-start: 5px solid var(--c); border-radius: 10px; padding: 8px 10px; }
.kz-rk .rk { font-family: var(--f-display); font-size: 24px; color: var(--gold); width: 24px; } .kz-rk small { color: var(--muted); margin-inline-start: auto; }
.kz-clock, .kz-tvbar span, .kz-rk small { direction: ltr; unicode-bidi: isolate; }
/* pocket-printer labels */
.kz-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(5,20,26,.94); overflow-y: auto; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.kz-ov-in { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; color: #fff6e4; }
.kz-labels { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; } .kz-labels img { width: 100%; border-radius: 6px; background: #fff; }
/* A4 printing: only the cards go to paper */
#kzPrintArea { display: none; }
@media print {
  body.kz-printing > *:not(#kzPrintArea) { display: none !important; }
  body.kz-printing { background: #fff !important; }
  body.kz-printing #kzPrintArea { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6mm; padding: 6mm; }
  .kzp-card { break-inside: avoid; border: 1.5px dashed #999; border-radius: 4mm; padding: 3mm; display: grid; justify-items: center; gap: 1.5mm; color: #000; font-family: var(--f-body); }
  .kzp-head { width: 100%; display: flex; justify-content: space-between; align-items: center; background: var(--c); color: #fff; border-radius: 2mm; padding: 1mm 3mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .kzp-head b { font-family: var(--f-display); font-size: 16pt; font-weight: 400; } .kzp-head span { font-size: 9pt; font-weight: 700; }
  .kzp-qr svg { width: 34mm; height: 34mm; display: block; }
  .kzp-code { font-family: ui-monospace, monospace; font-size: 15pt; font-weight: 700; letter-spacing: .1em; direction: ltr; }
  .kzp-spot { font-size: 8.5pt; text-align: center; }
}
.gart.treasure { background-color: #e6cf98; background-image: radial-gradient(ellipse at center, transparent 50%, rgba(122,74,22,.4) 100%), radial-gradient(rgba(140,92,34,.2) 1px, transparent 1.6px); background-size: 100% 100%, 9px 9px; overflow: hidden; }
/* free sessions and codes */
.modal-card { grid-template-columns: minmax(0, 1fr); }
.passbox { max-width: none; margin-top: 0; }
.passbox input { direction: ltr; letter-spacing: .12em; text-transform: uppercase; }
.passmsg { min-height: 1.4em; font-weight: 700; color: #c8232c; }
.pbtn.insta { display: block; text-align: center; text-decoration: none; background: linear-gradient(90deg, #f58529, #dd2a7b, #8134af); border-color: var(--navy); color: #fff; }
.passnote { font-size: 13px; color: #3c4a6b; text-align: center; background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 0; }
.gbtn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; color: var(--navy); box-shadow: 0 4px 0 var(--navy); }
.gbtn svg { flex: none; }
.whoami { font-size: 13px; color: #3c4a6b; text-align: center; }
.whoami a { color: inherit; }
.acc-me { display: flex; align-items: center; gap: 12px; }
.acc-me > div { flex: 1; display: grid; justify-items: start; gap: 2px; }
.acc-me b { font-size: 18px; }
.acc-box { display: grid; justify-items: start; gap: 6px; background: var(--cream); border: 2px dashed var(--navy); border-radius: 16px; padding: 10px 14px; }
.acc-box span { font-size: 14px; color: #3c4a6b; }
.acc-box .passline { margin: 0; font-size: 14.5px; }
.acc-box a { font-size: 13px; color: #3c4a6b; }
.acc-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.acc-del { display: grid; gap: 10px; border: 3px solid #c8232c; border-radius: 16px; padding: 12px 14px; background: #fff1f0; }
.acc-del b { font-size: 17px; color: #a01b22; }
.acc-del p { font-size: 14.5px; }
.pbtn.danger { background: #c8232c; color: #fff; border-color: #7a1016; box-shadow: 0 4px 0 #7a1016; }
.pbtn.danger-t { color: #a01b22; }
.pbtn:disabled { opacity: .6; }
.acc-ok { font-weight: 700; background: #e6f6ec; border: 2px solid #2f9e6f; border-radius: 14px; padding: 10px 14px; }
.passchip { display: inline-flex; gap: 6px; align-items: center; background: #2fbf71; color: #fff; border: 2px solid var(--navy); border-radius: 999px; padding: 2px 12px; font-weight: 700; font-size: 14px; }
/* the bell */
.sndbtn { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--navy); background: var(--white); color: var(--navy); display: grid; place-items: center; box-shadow: 0 3px 0 var(--navy); }
.sndbtn[aria-pressed="false"] { opacity: .6; }
button.logo { background: none; border: 0; padding: 0; cursor: pointer; }
.bellbtn { display: inline-flex; align-items: center; gap: 6px; }
.bellbtn svg { width: 22px; height: 22px; }
.bellbtn svg path, .bellbtn svg circle { fill: currentColor; }
.hub.ring .logo svg, .hub.ring .hcrew .av { animation: ring .12s linear 12; }
@keyframes ring { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-9deg); } 75% { transform: rotate(9deg); } }
.hostgone { background: #e9962b; color: #1b1405; text-align: center; font-weight: 700; border-radius: 12px; padding: 6px 10px; margin-bottom: 8px; animation: pop .35s ease-out; }
.resume { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--white); border: 2px dashed var(--navy); border-radius: 16px; padding: 8px 12px; margin-top: 12px; font-weight: 700; }
.resume span { flex: 1 1 100%; }
.foot a { color: inherit; }
/* one room for every game */
.modes.gamepick .mode { padding: 8px 10px; }
.modes.gamepick .mode b { font-size: 15px; }
.players { grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
.pl { padding: 5px 8px; gap: 8px; font: inherit; color: inherit; }
.pl .name { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.pl { border: 1px solid var(--line); background: var(--desk-2); width: 100%; }
.chips.pick .chip { font-size: 14px; padding: 5px 12px; font-weight: 700; border-width: 1.5px; }
.chips.pick .chip[aria-pressed="true"] { background: var(--sel); border-color: var(--marker); color: var(--marker-deep); }
/* طريقة اللعب (js/how.js): the goal on a sticky note, the steps as numbered cards, the details folded */
.how { display: grid; gap: 8px; text-align: start; color: #1b2a4a; }
/* ---- مزاد الأسئلة in the «الفسحة» look: cream paper, navy ink, bus yellow and red, chunky navy borders. The auction keeps two accents of its own: the amber LED price and each house's crest ---- */
body[data-theme="mazad"] {
  --desk: #fff6dc; --desk-2: #fffdf6; --desk-3: #f3e7c4; --line: #1b2a4a; --chalk: #1b2a4a; --muted: #4a5677; --soft: #3c4a6b;
  --marker: #1b2a4a; --marker-deep: #0d162b; --marker-ink: #ffc933; --paper: #fffdf6; --ink: #1b2a4a; --ok: #1f8a53; --gain: #1f8a53; --sel: #ffc933;
  --mzc: #12302a; --mz-navy: #1b2a4a; --mz-yard: #ffc933; --mz-red: #e5484d; --mz-red-d: #b3262c; --mz-ok: #1f8a53; --mz-cream: #fff6dc; --mz-white: #fffdf6; --mz-mute: #4a5677; --led: #ffb547;
  background: var(--mz-cream); color: var(--mz-navy);
}
body[data-theme="mazad"] .gtop { background: var(--mz-yard); color: var(--mz-navy); border: 3px solid var(--mz-navy); border-radius: 16px; padding: 6px 8px; margin-bottom: 10px; box-shadow: 0 4px 0 var(--mz-navy); }
body[data-theme="mazad"] .gtop .gt { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 19px; }
body[data-theme="mazad"] .gtop .mz-gico svg { width: 26px; height: 26px; }
.mz-gico svg { width: 30px; height: 30px; display: block; }
body[data-theme="mazad"] #tv { background: var(--mz-cream); color: var(--mz-navy); }
.mz-emb { display: block; flex: none; width: 40px; height: 40px; }
.mz-emb.xl { width: 96px; height: 96px; }
.mz-stars { color: #d99a00; letter-spacing: 1px; }
/* the phone */
.mz-top { background: var(--mz-white); color: var(--mz-navy); padding: 12px 14px 10px; display: grid; gap: 8px; border-radius: 20px; border: 3px solid var(--mz-navy); box-shadow: 0 5px 0 var(--mz-navy); flex: none; }
.mz-top .r1 { display: flex; align-items: center; gap: 10px; }
.mz-top .nm { flex: 1; min-width: 0; }
.mz-top .nm b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 22px; line-height: 1.1; }
.mz-top .nm small { font-size: 12px; color: var(--mz-mute); font-weight: 700; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mz-wallet { text-align: center; background: #0d1a14; border: 2.5px solid var(--mz-navy); border-radius: 12px; padding: 2px 10px; }
.mz-wallet small { display: block; font-size: 10px; color: #d8cfb6; font-weight: 700; line-height: 1.2; }
.mz-wallet b { font-family: var(--f-display); font-weight: 400; color: var(--led); font-size: 21px; line-height: 1.1; text-shadow: 0 0 8px rgba(255,181,71,.45); font-variant-numeric: tabular-nums; }
.mz-role { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 6px 10px; font-weight: 700; font-size: 13.5px; line-height: 1.4; border: 2px solid var(--mz-navy); }
.mz-role.neg { background: var(--mz-yard); }
.mz-role.adv { background: var(--mz-cream); }
.mz-role svg.i { width: 18px; height: 18px; flex: none; }
.mz-dots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.mz-dots span { font-size: 11px; font-weight: 700; text-align: center; color: #8a93ab; border-top: 4px solid #e3dcc6; padding-top: 3px; border-radius: 2px; }
.mz-dots span.on { color: var(--mz-navy); border-color: var(--mz-red); }
.mz-body { display: grid; gap: 12px; align-content: start; }
.mz-btn { border: 3px solid var(--mz-navy); border-radius: 16px; padding: 11px 14px; font-weight: 700; font-size: 16px; width: 100%; background: var(--mz-navy); color: var(--mz-yard); box-shadow: 0 4px 0 #0d162b; display: flex; align-items: center; justify-content: center; gap: 8px; }
.mz-btn:active { transform: translateY(3px); box-shadow: none; }
.mz-btn.ghost { background: var(--mz-white); color: var(--mz-navy); box-shadow: 0 4px 0 var(--mz-navy); }
.mz-h { font-family: var(--f-display); font-size: 24px; line-height: 1.2; }
.mz-muted { color: var(--mz-mute); font-size: 13px; }
.mz-card { background: var(--mz-white); border: 3px solid var(--mz-navy); border-radius: 18px; padding: 12px; box-shadow: 0 5px 0 var(--mz-navy); display: grid; gap: 4px; }
.mz-crow { display: flex; gap: 12px; align-items: center; }
.mz-terms { display: grid; gap: 2px; font-size: 14px; } .mz-terms .p { color: var(--mz-ok); } .mz-terms .n { color: var(--mz-red-d); }
.mz-now { background: var(--mz-navy); color: var(--mz-cream); border-radius: 14px; padding: 9px 12px; font-weight: 700; font-size: 14px; line-height: 1.5; }
.mz-now b { color: var(--mz-yard); }
.mz-watch { background: var(--mz-white); border: 3px dashed var(--mz-ok); border-radius: 14px; padding: 10px 12px; font-weight: 700; font-size: 14px; line-height: 1.55; }
.mz-mlot { display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; background: var(--mz-white); border: 3px solid var(--mz-navy); border-radius: 18px; padding: 8px 12px; box-shadow: 0 5px 0 var(--mz-navy); }
.mz-mlot .ci { width: 50px; height: 50px; border-radius: 14px; background: var(--mzc); color: var(--mz-yard); display: grid; place-items: center; border: 2.5px solid var(--mz-navy); }
.mz-mlot .ci .mz-cico { width: 28px; height: 28px; }
.mz-mlot b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 21px; line-height: 1.15; }
.mz-mlot .mz-muted { font-size: 12px; font-weight: 700; }
.mz-mlot .no { font-family: var(--f-display); color: var(--mz-red); font-size: 26px; }
.mz-mlot.gold { background: #ffe27a; }
.mz-price { background: #0d1a14; color: #f1e8d2; border-radius: 18px; padding: 12px 14px; display: grid; gap: 6px; border: 3px solid var(--mz-navy); box-shadow: 0 5px 0 var(--mz-navy); }
.mz-price .top { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; color: #d8cfb6; }
.mz-price .n { font-family: var(--f-display); color: var(--led); font-size: 46px; line-height: 1; text-shadow: 0 0 12px rgba(255,181,71,.5); font-variant-numeric: tabular-nums; }
.mz-price .n small { font-size: 16px; color: #d9b06a; text-shadow: none; }
.mz-price .by { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
.mz-price .by .mz-emb { width: 24px; height: 24px; }
.pcall { font-family: var(--f-display); font-size: 18px; color: var(--mz-yard); font-weight: 400; }
.pcall.hot { color: #ff8f93; }
.mz-pbar, .mz-tline { height: 7px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; }
.mz-tline { background: #e3dcc6; border: 1.5px solid var(--mz-navy); height: 9px; }
.mz-pbar i, .mz-tline i { display: block; height: 100%; background: var(--mz-yard); transform-origin: right; transition: transform .2s linear; }
.mz-tline i { background: var(--mz-red); }
.mz-bids, .mz-sealrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.mz-sealrow { grid-template-columns: repeat(2, 1fr); }
.mz-bid { border: 3px solid var(--mz-navy); background: var(--mz-yard); color: var(--mz-navy); border-radius: 14px; padding: 8px 4px; font-family: var(--f-display); font-size: 20px; box-shadow: 0 4px 0 var(--mz-navy); line-height: 1.15; }
.mz-bid small { display: block; font-family: var(--f-body); font-weight: 700; font-size: 11px; }
.mz-bid.all { grid-column: 1 / -1; background: var(--mz-red); color: #fff; }
.mz-bid.adv, .mz-bid.ghost { background: var(--mz-white); }
.mz-bid:disabled { background: #ece5d2; color: #9a9fae; border-color: #b8b3a2; box-shadow: 0 4px 0 #b8b3a2; cursor: not-allowed; }
.mz-bid:active:not(:disabled) { transform: translateY(3px); box-shadow: none; }
.mz-sugg { display: grid; gap: 6px; }
.mz-sugg div { display: flex; gap: 8px; align-items: center; background: #fff1b8; border: 2.5px dashed var(--mz-navy); border-radius: 12px; padding: 6px 10px; font-weight: 700; font-size: 14px; animation: pop .3s ease-out both; }
.mz-sugg button { margin-inline-start: auto; border: 0; background: var(--mz-navy); color: var(--mz-yard); border-radius: 10px; padding: 4px 12px; font-weight: 700; font-size: 13px; }
.mz-sugg button:disabled { opacity: .45; }
.mz-q { font-weight: 700; font-size: 18px; line-height: 1.5; }
.mz-opts { display: grid; gap: 8px; }
.mz-opt { text-align: start; border: 3px solid var(--mz-navy); background: var(--mz-white); border-radius: 14px; padding: 9px 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; min-height: 50px; color: var(--mz-navy); box-shadow: 0 4px 0 var(--mz-navy); }
.mz-opt[aria-pressed="true"] { background: var(--mz-yard); }
.mz-opt.ok { background: #c9efd6; }
.mz-opt.no { background: #ffd2d3; }
.mz-opt .vv { margin-inline-start: auto; display: flex; }
.mz-opt .vv .av { margin-inline-start: -8px; }
.mz-res { text-align: center; display: grid; gap: 6px; justify-items: center; padding: 16px 12px; background: var(--mz-white); border: 3px solid var(--mz-navy); border-radius: 20px; box-shadow: 0 5px 0 var(--mz-navy); animation: pop .4s ease-out both; }
.mz-res .big { font-family: var(--f-display); font-size: 32px; line-height: 1.15; }
.mz-res .plus { color: var(--mz-ok); } .mz-res .minus { color: var(--mz-red-d); }
.mz-led { font-family: var(--f-display); color: var(--mz-navy); font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.mz-led small { font-size: 15px; margin-inline-start: 6px; color: var(--mz-mute); }
.mz-led.red { color: var(--mz-red-d); } .mz-led.sm { font-size: 22px; }
.mz-sell { display: grid; gap: 8px; margin-top: 6px; }
.mz-sell .mz-btn { justify-content: flex-start; }
.mz-chipst { font-size: 12px; font-weight: 700; border-radius: 99px; padding: 0 9px; background: #e9e3d0; color: var(--mz-navy); white-space: nowrap; border: 1.5px solid var(--mz-navy); }
.mz-chipst.lead { background: var(--mz-yard); }
.mz-chipst.broke { background: var(--mz-red); color: #fff; }
.mz-rank { gap: 6px; }
.mz-rank div { display: grid; grid-template-columns: 22px 34px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 12px; }
.mz-rank div.me { background: var(--mz-yard); }
.mz-rank .rk { font-family: var(--f-display); font-size: 20px; color: var(--mz-red); text-align: center; }
.mz-rank .mz-emb { width: 34px; height: 34px; }
.mz-awards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.mz-awards div { background: var(--mz-navy); border-radius: 14px; padding: 8px 6px; text-align: center; display: grid; gap: 2px; box-shadow: 0 4px 0 #0d162b; }
.mz-awards small { font-size: 11px; color: #c8cfe0; font-weight: 700; } .mz-awards b { font-size: 13px; color: var(--mz-yard); line-height: 1.35; }
.mz-lteam > b { display: flex; align-items: center; gap: 6px; } .mz-lteam > b .mz-emb { width: 28px; height: 28px; }
/* the big screen: a 16:9 board inside the TV stage, sized in container units so it scales as one piece */
.mzt { position: relative; width: 1270px; height: 714px; justify-self: center; align-self: center; container-type: inline-size; color: var(--mz-navy); background: var(--mz-white); border: 4px solid var(--mz-navy); border-radius: 28px; overflow: hidden; box-shadow: 0 8px 0 var(--mz-navy); }
.mzt .mz-emb { width: 3cqw; height: 3cqw; }
.mzt .av { filter: none; }
.mz-th { position: absolute; top: 1.8cqw; inset-inline: 2.4cqw; height: 5cqw; display: grid; grid-template-columns: auto 1fr auto; gap: 2cqw; align-items: center; z-index: 2; }
.mz-logo { display: flex; align-items: center; gap: .9cqw; }
.mz-logo > svg { width: 4.4cqw; height: 4.4cqw; }
.mz-logo b { font-family: var(--f-display); font-weight: 400; font-size: 2.8cqw; line-height: 1; display: block; }
.mz-logo small { display: block; font-size: 1.15cqw; color: var(--mz-mute); font-weight: 700; }
.mz-lots { display: flex; gap: .5cqw; justify-content: center; }
.mz-lots i { width: 2.3cqw; height: 3cqw; border-radius: .5cqw; border: .2cqw solid var(--mz-navy); background: var(--mz-white); display: grid; place-items: center; font-style: normal; font-family: var(--f-display); font-size: 1.15cqw; color: var(--mz-navy); }
.mz-lots i.g { background: #ffe27a; }
.mz-lots i.done { background: var(--mz-navy); color: var(--mz-yard); }
.mz-lots i.now { background: var(--mz-red); color: #fff; box-shadow: 0 .35cqw 0 var(--mz-navy); transform: translateY(-.35cqw); }
.mz-phs { display: flex; gap: .4cqw; }
.mz-phs span { font-size: 1.15cqw; font-weight: 700; color: var(--mz-navy); padding: .15cqw .9cqw; border-radius: 99px; border: .2cqw solid var(--mz-navy); background: var(--mz-white); }
.mz-phs span.on { background: var(--mz-navy); color: var(--mz-yard); }
.mz-main { position: absolute; top: 8.6cqw; bottom: 6.6cqw; inset-inline: 2.4cqw; display: grid; grid-template-columns: minmax(0, 1fr) 27cqw; gap: 1.8cqw; z-index: 2; }
.mz-stage { display: grid; grid-template-columns: 20cqw minmax(0, 1fr); gap: 1.6cqw; min-width: 0; align-items: start; }
.mz-narr { position: absolute; bottom: 1.6cqw; inset-inline: 0; display: flex; justify-content: center; z-index: 3; pointer-events: none; }
.mz-narr div { background: var(--mz-navy); color: var(--mz-cream); border-radius: 99px; padding: .35cqw 2cqw; font-size: 1.55cqw; font-weight: 700; box-shadow: 0 .35cqw 0 #0d162b; }
.mz-narr b { color: var(--mz-yard); }
.mz-lotcard { position: relative; background: var(--mz-white); color: var(--mz-navy); border: .25cqw solid var(--mz-navy); border-radius: 1.6cqw; padding: 1.2cqw 1.2cqw 1cqw; display: grid; gap: .6cqw; align-content: start; justify-items: center; text-align: center; box-shadow: 0 .45cqw 0 var(--mz-navy); }
.mz-lotcard .no { font-size: 1.15cqw; font-weight: 700; color: var(--mz-mute); }
.mz-lotcard .num { font-family: var(--f-display); font-size: 3.4cqw; line-height: 1; color: var(--mz-red); }
.mz-lotcard .num small { font-size: 1.4cqw; color: var(--mz-mute); }
.mz-lotcard .ci { width: 7.2cqw; height: 7.2cqw; border-radius: 1.8cqw; background: var(--mzc); color: var(--mz-yard); display: grid; place-items: center; border: .22cqw solid var(--mz-navy); }
.mz-lotcard .ci .mz-cico { width: 4.2cqw; height: 4.2cqw; }
.mz-lotcard .cat { font-family: var(--f-display); font-size: 2.1cqw; line-height: 1.15; text-wrap: balance; }
.mz-lotcard .diff { display: flex; gap: .5cqw; align-items: center; flex-wrap: wrap; justify-content: center; font-size: 1.15cqw; font-weight: 700; line-height: 1.4; }
.mz-lotcard .mz-stars { font-size: 1.5cqw; }
.mz-lotcard .terms { display: grid; gap: .2cqw; width: 100%; font-size: 1.12cqw; font-weight: 700; border-top: .15cqw dashed var(--mz-navy); padding-top: .5cqw; }
.mz-lotcard .terms > span { display: flex; justify-content: space-between; gap: .6cqw; }
.mz-lotcard .terms .p { color: var(--mz-ok); } .mz-lotcard .terms .n { color: var(--mz-red-d); }
.mz-lotcard .ttype { font-size: 1.15cqw; font-weight: 700; background: var(--mz-navy); color: var(--mz-yard); border-radius: 99px; padding: .05cqw 1cqw; }
.mz-seal { position: absolute; top: 1cqw; inset-inline-end: -1.4cqw; width: 6.4cqw; height: 6.4cqw; filter: drop-shadow(0 .3cqw 0 rgba(27,42,74,.6)); }
.mz-seal.anim { animation: mzStamp .4s cubic-bezier(.2,1.6,.4,1) both; }
.mz-lotcard.gold { background: #ffe27a; }

/* ---- مَن الفاعل؟ wears فسحة (cream, navy, the yellow, 3px ink borders); the board keeps its own ink city on parchment ---- */
body[data-theme="manfael"] {

@keyframes mfPop { from { transform: scale(.4); opacity: 0; } }
@keyframes mfFade { from { opacity: 0; } }
@keyframes mfUp { from { transform: translateY(40%); opacity: 0; } }
@keyframes mfStamp { from { transform: scale(2.2) rotate(-6deg); opacity: 0; } }
@keyframes mfDraw { from { stroke-dashoffset: 110; } }
@keyframes mfDrawIn { to { stroke-dashoffset: 0; } }
@keyframes mfDim { to { background: #8f8a7a; } }
@keyframes mfDim2 { to { opacity: .35; } }
@keyframes mfFill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes mfVanish { to { opacity: 0; transform: scale(.2) rotate(30deg); } }
@keyframes mfSway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
@keyframes mfBounce { to { transform: translateY(-1cqw); } }
@keyframes mfLie { to { opacity: .55; text-decoration: line-through; text-decoration-color: #e5484d; } }
@keyframes mfOk { to { background: #cdeed8; border-color: #1f8a53; } }
@keyframes mfRise { 0%, 100% { opacity: .35; transform: translateY(2px); } 50% { opacity: .9; transform: translateY(-4px); } }
@keyframes mfFlick { to { transform: scale(1.12, .9); } }
@keyframes mfGlow { to { opacity: .6; } }
@keyframes mfPopIn { 0% { opacity: 0; transform: scale(.4); } 12% { opacity: 1; transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .mfx *, .mft *, .mf-res, .mf-wit { animation-duration: .01s !important; animation-delay: 0s !important; transition: none !important; } }
/* ---- سوق المدينة in فسحة's «الفسحة» look: cream, navy, yellow and red, Lalezar titles, chunky navy borders.
   The game's own colour is #b07a2e; the Madinah market drawing stays as the board itself. ---- */
.gart.market { background: #b07a2e; overflow: hidden; } .gart.market svg { position: absolute; inset: 0; width: 100%; height: 100%; }

  --desk: #fff6dc; --desk-2: #fffdf6; --desk-3: #f3e7c3; --line: #1b2a4a; --chalk: #1b2a4a; --muted: #4a5677; --soft: #3c4a6b;
  --marker: #1b2a4a; --marker-deep: #0d162b; --marker-ink: #ffc933; --paper: #fffdf6; --ink: #1b2a4a; --ok: #1f8a53; --gain: #1f8a53; --sel: #ffc933;

<script>
  if ("serviceWorker" in navigator && !/Fos7aApp/.test(navigator.userAgent)) {
    addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    // a new version just took over: reload once to show it, unless someone is in the middle of a room
    const hadOne = !!navigator.serviceWorker.controller;
