<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffc933">
<meta name="description" content="ألعاب جماعية للجمعات: افتحوا غرفة وكل واحد يلعب من جواله.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="فسحة">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>فسحة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: فسحة is the school yard (bus yellow, navy ink); each game opens its own room: خلّصت! on a ruled notebook, خط ثلاثة on a chalkboard. Two typefaces everywhere. */
:root {
  --yard: #ffc933; --yard-deep: #e0a800; --cream: #fff6dc; --navy: #1b2a4a; --navy-2: #2c3e66; --red: #e5484d; --white: #fffdf6;
  --f-display: "Lalezar", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.6; background: var(--cream); color: var(--navy); -webkit-tap-highlight-color: transparent; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
.av { display: block; filter: drop-shadow(0 3px 3px rgba(0,0,0,.3)); flex: none; }

/* ================= the yard (hub) ================= */
.hub { padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right)); padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
.hub-in { max-width: 1060px; margin: 0 auto; }
.hdr { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px; }
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 34px; line-height: 1; color: var(--navy); text-decoration: none; }
.logo svg { width: 34px; height: 34px; }
.nav { display: flex; gap: 18px; font-weight: 600; font-size: 15px; }
.nav a { color: var(--navy); text-decoration: none; opacity: .8; }
.me-chip { display: flex; align-items: center; gap: 8px; background: var(--white); border: 2px solid var(--navy); border-radius: 999px; padding: 3px 12px 3px 4px; font-weight: 700; box-shadow: 0 3px 0 var(--navy); }
.hero { background: var(--yard); border-radius: 28px; padding: 30px 26px; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: center; position: relative; overflow: hidden; border: 3px solid var(--navy); box-shadow: 0 6px 0 var(--navy); }
.joinbox { display: flex; gap: 8px; margin-top: 16px; max-width: 360px; }
.joinbox input { flex: 1; min-width: 0; border: 3px solid var(--navy); border-radius: 14px; padding: 8px 12px; font-family: var(--f-display); font-size: 22px; letter-spacing: .2em; text-align: center; background: var(--white); color: var(--navy); direction: ltr; text-transform: uppercase; }
.qr svg { width: 100%; height: auto; display: block; }
.hero h1 { font-size: clamp(64px, 12vw, 116px); color: var(--navy); }
.hero .kick { font-weight: 700; font-size: 15px; }
.hero p.lead { font-size: 18px; max-width: 30em; margin-top: 6px; }
.hero-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.hbtn { border: 3px solid var(--navy); border-radius: 16px; padding: 10px 20px; font-weight: 700; font-size: 17px; background: var(--navy); color: var(--yard); box-shadow: 0 4px 0 #0d162b; text-decoration: none; display: inline-block; }
.hbtn.alt { background: var(--white); color: var(--navy); box-shadow: 0 4px 0 var(--navy); }
.hbtn:active { transform: translateY(3px); box-shadow: none; }
.crew { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.crew .av:nth-child(odd) { transform: translateY(10px); }
.bell { position: absolute; top: 14px; inset-inline-start: 16px; width: 54px; height: 54px; opacity: .9; }
section.sec { margin-top: 56px; }
.sec-h { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
.sec-h h2 { font-size: 34px; }
.sec-h i { width: 6px; height: 30px; background: var(--red); border-radius: 3px; display: block; }
.games { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.gcard { background: var(--white); border: 3px solid var(--navy); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 5px 0 var(--navy); }
.gart { height: 190px; position: relative; display: grid; place-items: center; }
.gart.notebook { background: #fbf8ef; background-image: linear-gradient(to left, transparent 34px, #e46b6b 34px, #e46b6b 36px, transparent 36px), repeating-linear-gradient(to bottom, transparent 0 27px, #bcd2ec 27px 28px); }
.gart.chalk { background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.06), transparent 60%), #22402f; }
.gart.desk { background: radial-gradient(circle at 70% 20%, rgba(44,85,224,.25), transparent 60%), #151c2d; }
.gart .gname { font-family: var(--f-display); font-size: 44px; line-height: 1; }
.gbody { padding: 14px 16px 16px; display: grid; gap: 10px; flex: 1; align-content: start; }
.gbody h3 { font-size: 28px; }
.gbody p { font-size: 14.5px; color: #3c4a6b; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { font-size: 12.5px; font-weight: 700; background: var(--cream); border: 1.5px solid #e8d9a8; border-radius: 999px; padding: 1px 10px; }
.gbtns { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 8px; margin-top: auto; }
.play { border: 0; border-radius: 14px; background: var(--navy); color: var(--yard); font-weight: 700; font-size: 16px; padding: 10px; text-align: center; text-decoration: none; }
.info { border: 2px solid var(--navy); border-radius: 14px; background: var(--white); font-family: var(--f-display); font-size: 20px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.step { background: var(--white); border-radius: 20px; padding: 18px; border: 2px dashed #d9c78d; }
.step b { font-family: var(--f-display); font-size: 34px; color: var(--red); line-height: 1; display: block; }
.step h3 { font-family: var(--f-body); font-weight: 700; font-size: 17px; margin-top: 6px; }
.step p { font-size: 14.5px; color: #3c4a6b; }
.plans { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.plan { background: var(--white); border: 3px solid var(--navy); border-radius: 22px; padding: 18px; display: grid; gap: 8px; align-content: start; }
.plan.star { background: var(--yard); box-shadow: 0 5px 0 var(--navy); }
.plan h3 { font-size: 28px; }
.price { font-family: var(--f-display); font-size: 36px; line-height: 1.1; }
.price small { font-family: var(--f-body); font-size: 14px; font-weight: 600; }
.plan ul { margin: 0; padding-inline-start: 18px; font-size: 14.5px; display: grid; gap: 2px; }
.note { font-size: 13px; color: #5d6887; margin-top: 10px; }
.faq { display: grid; gap: 10px; }
.faq details { background: var(--white); border-radius: 16px; padding: 12px 16px; border: 2px solid #eadcae; }
.faq summary { font-weight: 700; cursor: pointer; }
.faq p { margin-top: 6px; color: #3c4a6b; font-size: 15px; }
.foot { margin-top: 56px; padding-block: 22px 40px; border-top: 2px dashed #d9c78d; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13.5px; color: #5d6887; }
.modal { position: fixed; inset: 0; background: rgba(27,42,74,.55); display: flex; align-items: flex-end; justify-content: center; z-index: 50; padding: 0 12px; }
.modal-card { width: 100%; max-width: 520px; max-height: 88vh; max-height: 88dvh; overflow: auto; padding-bottom: calc(26px + env(safe-area-inset-bottom)) !important; background: var(--white); border-radius: 26px 26px 0 0; border: 3px solid var(--navy); border-bottom: 0; padding: 20px 18px 26px; display: grid; gap: 12px; }
.modal-card h3 { font-size: 30px; }
.modal-card ol { margin: 0; padding-inline-start: 22px; display: grid; gap: 6px; }
@media (max-width: 860px) { .games, .steps, .plans { grid-template-columns: minmax(0, 1fr); } .hero { grid-template-columns: minmax(0, 1fr); } .nav { display: none; } }

/* ================= profile ================= */
.prof { max-width: 460px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); display: grid; gap: 12px; }
.pcard { background: var(--white); border: 3px solid var(--navy); border-radius: 22px; padding: 16px; box-shadow: 0 5px 0 var(--navy); }
.builder { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 14px; align-items: center; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; font-weight: 700; }
.field input { border: 2px solid var(--navy); border-radius: 12px; padding: 7px 10px; background: #fff; color: var(--navy); font-size: 17px; width: 100%; }
.ptabs { display: flex; gap: 6px; }
.ptab { flex: 1; border: 2px solid var(--navy); background: var(--cream); border-radius: 12px 12px 0 0; padding: 6px 0; font-size: 13.5px; font-weight: 700; }
.ptab[aria-selected="true"] { background: var(--yard); }
.popts { background: var(--white); border: 2px solid var(--navy); border-radius: 0 0 14px 14px; padding: 10px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: -2px; }
.popt { border: 2px solid transparent; background: #f3eee0; border-radius: 12px; padding: 4px; display: grid; place-items: center; }
.popt[aria-pressed="true"] { border-color: var(--red); background: #fff; }
.popt small { font-size: 11px; }
.pbtn { border: 3px solid var(--navy); border-radius: 16px; padding: 11px; font-weight: 700; font-size: 17px; background: var(--navy); color: var(--yard); box-shadow: 0 4px 0 #0d162b; width: 100%; }
.pbtn.alt { background: var(--white); color: var(--navy); box-shadow: 0 4px 0 var(--navy); }

/* ================= game shell ================= */
#game { min-height: 100vh; min-height: 100dvh; }
html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
.gshell { height: 100vh; height: 100dvh; max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.gtop { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 8px; font-size: 13px; }
.gtop .x { width: 38px; height: 38px; border-radius: 12px; border: 1.5px solid currentColor; background: transparent; display: grid; place-items: center; opacity: .8; }
.gtop .gt { font-family: var(--f-display); font-size: 22px; line-height: 1; }
.gtop .code { font-family: var(--f-display); font-size: 18px; letter-spacing: .12em; direction: ltr; }
#screen { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 12px; padding-bottom: 6px; }

/* ---- خلّصت! lives on a ruled notebook ---- */
body[data-theme="khallast"] {
  --desk: #fbf8ef; --desk-2: #fffdf7; --desk-3: #efe8d4; --line: #d8ccab; --chalk: #1c2433; --muted: #6b6454; --soft: #3b3a33;
  --marker: #c8232c; --marker-deep: #8f1820; --marker-ink: #fff; --paper: #ffffff; --rule: #c7d7ea; --margin: #e46b6b; --ink: #1c2433; --ink-blue: #1d3fb8; --ink-red: #c8232c; --ok: #1f8a53; --gain: #1f8a53; --sel: #fdeaea;
  background: #fbf8ef; background-image: linear-gradient(to left, transparent 22px, rgba(228,107,107,.55) 22px, rgba(228,107,107,.55) 24px, transparent 24px), repeating-linear-gradient(to bottom, transparent 0 31px, rgba(151,183,222,.45) 31px 32px);
  color: var(--chalk);
}
body[data-theme="khallast"] .gtop .gt { color: var(--ink-red); }
.paper { background: var(--paper); color: var(--ink); border-radius: 8px; padding: 16px; box-shadow: 0 16px 30px -14px rgba(0,0,0,.75);
  background-image: linear-gradient(to left, transparent 30px, var(--margin) 30px, var(--margin) 31.5px, transparent 31.5px), repeating-linear-gradient(to bottom, transparent 0 29px, var(--rule) 29px 30px); background-position: 0 10px; }
.paper h2 { font-size: 28px; }
.muted { color: var(--muted); font-size: 13.5px; }
.pmuted { color: #5f6b80; font-size: 13.5px; }
.btn { border: 0; border-radius: 16px; padding: 12px 16px; font-weight: 700; font-size: 17px; width: 100%; }
.btn-marker { background: var(--marker); color: var(--marker-ink); box-shadow: 0 5px 0 var(--marker-deep); }
.btn-marker:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--marker-deep); }
.btn-marker[disabled] { background: var(--line); color: var(--soft); box-shadow: 0 5px 0 var(--desk-3); opacity: .7; cursor: not-allowed; transform: none; }
.btn-ghost { background: var(--desk-2); border: 1.5px solid var(--line); color: var(--chalk); }
.btn-ghost[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }

/* lobby */
.players { display: grid; gap: 8px; }
.pl { display: flex; align-items: center; gap: 10px; background: var(--desk-2); border: 1px solid var(--line); border-radius: 14px; padding: 6px 10px; }
.pl .name { font-weight: 700; }
.pl .tag { font-size: 12px; color: var(--muted); }
.pl.me { border-color: var(--marker); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; background: var(--desk-3); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--soft); }

.modes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mode { text-align: start; background: var(--desk-2); border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; }
.mode b { font-size: 16px; }
.mode small { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.mode[aria-pressed="true"] { border-color: var(--marker); background: var(--sel); }
/* writing */
.letter-box { display: flex; align-items: center; gap: 14px; }
.letter { font-family: var(--f-display); font-size: 64px; line-height: 1; color: var(--ink-red); width: 76px; height: 76px; display: grid; place-items: center; border: 3px solid var(--ink-red); border-radius: 50%; background: #fff; transform: rotate(-6deg); flex: none; }
.timer { height: 6px; border-radius: 6px; background: var(--desk-3); overflow: hidden; }
.timer i { display: block; height: 100%; background: var(--marker); transform-origin: right; transition: transform .25s linear; }
.strip { display: flex; gap: 6px; flex-wrap: wrap; }
.mini { position: relative; }
.mini .ok { position: absolute; bottom: -3px; left: -3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 11px; display: grid; place-items: center; border: 2px solid var(--desk); }
.cat { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 8px; border-bottom: 1px dashed #9fb2cb; padding: 3px 0; }
.cat label { font-weight: 700; font-size: 14.5px; }
.cat input { border: 0; background: transparent; border-bottom: 2px solid transparent; padding: 3px 2px; color: var(--ink-blue); font-size: 18px; font-weight: 600; width: 100%; }
.cat input:focus { outline: none; border-bottom-color: var(--ink-blue); }
.cat input:disabled { color: #4a5568; }
.banner { background: var(--ink-red); color: #fff; border-radius: 14px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-weight: 700; }
.banner b { font-family: var(--f-display); font-weight: 400; font-size: 34px; line-height: 1; }
.peek { background: #fff6cc; color: var(--ink); border-radius: 14px; padding: 10px 14px; border: 2px dashed var(--marker-deep); font-size: 15px; }

/* voting */
.ans { color: var(--ink); background: #fff; border: 1.5px solid #d3deec; border-radius: 12px; padding: 8px 10px; display: grid; gap: 6px; }
.ans-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.ans-text { font-size: 19px; font-weight: 700; color: var(--ink-blue); }
.dup { font-size: 12px; font-weight: 700; background: #e8edf6; color: #26304a; border-radius: 999px; padding: 0 8px; }
.votes { display: flex; gap: 6px; }
.vote { flex: 1; border: 1.5px solid #c2cddd; background: #f6f8fb; color: #26304a; border-radius: 10px; padding: 5px 4px; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; }
.vote span { font-weight: 600; color: #6a768c; font-variant-numeric: tabular-nums; }
.vote[aria-pressed="true"].acc { background: #d8f2e3; border-color: var(--ok); color: #11643b; }
.vote[aria-pressed="true"].rej { background: #fde1e1; border-color: var(--ink-red); color: var(--ink-red); }
.vote[aria-pressed="true"].lol { background: #fff3c4; border-color: var(--marker-deep); color: #6b5a0c; }
.mine { font-size: 12.5px; color: #5f6b80; }
.who { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.who .p { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
.pts { font-family: var(--f-display); font-size: 20px; line-height: 1; color: var(--ok); }
.pts.zero { color: #9aa5bb; }
.stamp { font-family: var(--f-display); font-size: 16px; border: 2.5px solid currentColor; border-radius: 8px; padding: 0 8px; transform: rotate(-8deg); line-height: 1.5; }
.stamp.yes { color: var(--ok); } .stamp.no { color: var(--ink-red); }
.ring { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--marker); }

/* results */
.board { display: grid; gap: 8px; }
.rank { display: grid; grid-template-columns: 26px 44px minmax(0, 1fr) auto; align-items: center; gap: 10px; background: var(--desk-2); border: 1px solid var(--line); border-radius: 14px; padding: 6px 12px; }
.rank .n { font-family: var(--f-display); font-size: 22px; color: var(--muted); text-align: center; }
.rank .sc { font-family: var(--f-display); font-size: 26px; color: var(--marker); }
.rank .gain { font-size: 12.5px; color: var(--gain); font-weight: 700; }
.rank.me { border-color: var(--marker); }
.best { background: #fff3c4; color: var(--ink); border-radius: 14px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; }

/* certificate */
.cert { background: #fffdf4; color: var(--ink); border-radius: 6px; padding: 18px 16px 16px; text-align: center; position: relative; box-shadow: 0 18px 34px -14px rgba(0,0,0,.8); outline: 3px double #b39a22; outline-offset: -10px; display: grid; gap: 6px; justify-items: center; }
.cert h2 { font-size: 32px; color: #8a6d12; }
.cert .title { font-family: var(--f-display); font-size: 30px; color: var(--ink-red); line-height: 1.2; }
.cert .seal { position: absolute; bottom: 16px; inset-inline-start: 18px; width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--ink-red); color: var(--ink-red); display: grid; place-items: center; font-family: var(--f-display); font-size: 16px; transform: rotate(-14deg); opacity: .85; }
.cert .sign { font-size: 13px; color: #5f6b80; margin-top: 8px; }
.others { display: grid; gap: 6px; }
.other { display: flex; align-items: center; gap: 10px; background: var(--desk-2); border-radius: 12px; padding: 6px 10px; font-size: 14.5px; }
.other b { color: var(--marker); font-weight: 700; }




/* ---- خط ثلاثة lives on a chalkboard ---- */
body[data-theme="khat"] {
  --board: #22402f; --board-2: #2b4d3a; --chalk-w: #f3f1e6; --chalk-dim: #b8c7b9; --chalk-y: #ffe27a; --tb: #9cc8ff; --tr: #ffa3a3; --wood: #7a4f2a;
  background: radial-gradient(900px 500px at 20% 0%, rgba(255,255,255,.05), transparent 60%), radial-gradient(700px 400px at 90% 80%, rgba(255,255,255,.04), transparent 60%), var(--board);
  color: var(--chalk-w);
}
body[data-theme="khat"] .gtop .gt { color: var(--chalk-y); }
.k-card { border: 2px solid rgba(243,241,230,.55); border-radius: 16px; padding: 14px; background: rgba(0,0,0,.12); }
.k-h { font-family: var(--f-display); font-size: 30px; color: var(--chalk-y); text-shadow: 0 0 1px rgba(255,255,255,.4); }
.k-dim { color: var(--chalk-dim); font-size: 14px; }
.k-teams { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.k-team { border: 2px dashed currentColor; border-radius: 16px; padding: 10px; display: grid; gap: 6px; align-content: start; }
.k-team.b { color: var(--tb); } .k-team.r { color: var(--tr); }
.k-team h3 { font-size: 22px; }
.k-p { display: flex; align-items: center; gap: 6px; color: var(--chalk-w); font-weight: 600; font-size: 14.5px; }
.k-score { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--f-display); font-size: 22px; }
